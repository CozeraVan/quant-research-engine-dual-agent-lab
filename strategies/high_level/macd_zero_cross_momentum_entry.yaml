# =============================================================================
# MACD 零轴交叉动量策略 (MACD Zero-Cross Momentum)
# =============================================================================
# 策略类型: 动量 (momentum)
# 难度: ★★★☆☆ (中阶)
# 说明: MACD 线在零轴下方上穿信号线时买入（捕捉早期动量反转），
#       MACD 线回落至信号线下方时卖出。
#       使用 crosses_above / crosses_below 运算符实现交叉检测。
# =============================================================================

# --- 策略身份和交易规则 ---
# 参考: docs/strategy_entry/strategy_card.md
strategy:
  id: macd_zero_cross_momentum
  name: MACD Zero-Cross Momentum
  family: momentum
  description: >
    Buy when MACD line crosses above signal line while both are below zero
    (early momentum turn). Exit when MACD line crosses back below signal line.
    Long-only, daily A-share.
  direction: long_only
  version: "1.0.0"

rules:
  # 入场: MACD 线上穿信号线 AND MACD < 0 (零轴下方金叉)
  entry:
    all:
      - alias: macd_line
        operator: crosses_above    # 交叉运算符: 昨日 < signal, 今日 > signal
        alias_b: macd_signal
      - alias: macd_line
        operator: "<"
        value: 0                   # MACD 仍在零轴下方 (早期反转)
  # 离场: MACD 线下穿信号线 (死叉)
  exit:
    any:
      - alias: macd_line
        operator: crosses_below    # 交叉运算符: 昨日 > signal, 今日 < signal
        alias_b: macd_signal
  # 风控参数
  risk:
    stop_loss_pct: 0.08
    max_holding_days: 10

# --- 因子需求 ---
# 参考: docs/strategy_entry/factor_requirements.md
factor_requirements:
  - alias: macd_line
    indicator: macd
    source: close
    params:
      fast: 12                 # 快线周期
      slow: 26                 # 慢线周期
      signal: 9                # 信号线周期
    output: macd               # MACD 线 (DIF)
    required: true
    reason: MACD line for zero-axis position and crossover detection

  - alias: macd_signal
    indicator: macd
    source: close
    params:
      fast: 12
      slow: 26
      signal: 9
    output: signal              # 信号线 (DEA)
    required: true
    reason: MACD signal line for crossover entry and exit

# --- 实验配置 ---
# 参考: docs/strategy_entry/experiment_plan.md
experiment:
  id: macd_zero_cross_momentum_smoke
  frequency: daily
  market: ashare
  start: 2024-01-01
  end: 2024-02-01
  universe:
    include: all_a
    exclude_st: true
    exclude_suspended: true
    exclude_risk_warning: true
    min_listing_days: 250
  execution:
    signal_date: t
    entry_execution: t_plus_1_open
    exit_execution: t_plus_1_open
    market_profile: ashare_daily_default
  capital:
    initial_cash: 1000000
    max_positions: 10
    position_weight: equal
  output:
    dir: outputs/macd_zero_cross_momentum_smoke/
