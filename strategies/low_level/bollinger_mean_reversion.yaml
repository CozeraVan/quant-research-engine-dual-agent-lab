# =============================================================================
# 布林带均值回归
# =============================================================================
# 策略类型: 均值回归 (mean_reversion)
# 难度: ★★☆☆☆ (进阶)
# 说明: 价格触及布林下轨时买入（超卖），回到中轨时卖出（均值回归）。
#       已验证在全市场回测中产生有效交易 (5525 只标的, 2010-2026)。
# 对应高层入口: strategies/high_level/bollinger_mean_reversion_entry.yaml
#   编译命令: uv run qre compile strategies/high_level/bollinger_mean_reversion_entry.yaml
#
# 因子路径说明:
#   bbl_20_2_0_2_0 = Bollinger Band Lower, period=20, stddev=2.0
#   bbm_20_2_0_2_0 = Bollinger Band Middle, period=20, stddev=2.0 (= SMA 20)
# =============================================================================

experiment:
  name: bollinger_mean_reversion

# --- 数据源 ---
data:
  factor_fields:
    bb_lower: factors.stock_daily_volatility_close.bbl_20_2_0_2_0    # 布林下轨
    bb_middle: factors.stock_daily_volatility_close.bbm_20_2_0_2_0   # 布林中轨 (20 SMA)
  market_fields:                                                      # 行情字段
  - open
  - high
  - low
  - close
  - pre_close
  - vol
  - amount

# --- 交易信号 ---
signal:
  entry: (close <= bb_lower)               # 收盘价触及下轨 → 超卖，买入
  exit: (close >= bb_middle)               # 收盘价回到中轨 → 均值回归，卖出

# --- 评估配置 ---
evaluation:
  forward_return_horizons:                 # 前向收益周期
  - 1
  - 3
  - 5
  - 10
  - 20

# --- 持仓限制 ---
holding:
  max_holding_days: 20                     # 最长持有 20 个交易日

# --- 风控参数 ---
risk:
  stop_loss_pct: 0.08                      # 止损 -8%
  take_profit_pct: null                    # 止盈 (未启用)
  trailing_stop_pct: null                  # 移动止损 (未启用)

# --- 标的范围 ---
universe:
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120
  min_amount: null
