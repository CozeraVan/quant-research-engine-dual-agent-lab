# =============================================================================
# RSI2 超卖反转 — + 风控 + 权重 + 再平衡
# =============================================================================
# 策略类型: 均值回归 (mean_reversion)
# 难度: ★★☆☆☆ (进阶)
# 说明: RSI2 系列最完整版本，在前三版基础上增加定期再平衡。新增:
#       - rebalance_interval_days: 5 (每 5 个交易日重新分配仓位)
#       再平衡会卖出超涨标的、加仓新触发信号，保持组合始终追踪最强信号。
# =============================================================================

experiment:
  name: rsi2_reversal_with_rebalance_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

# --- 数据源 ---
data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    rsi_2: factors.stock_daily_momentum_close.rsi_2

# --- 交易信号 ---
signal:
  type: expression
  entry: rsi_2 < 10

# --- 持仓限制 ---
holding:
  max_holding_days: 5
  direction: long_only

# --- 风控参数 ---
risk:
  stop_loss_pct: 0.08
  take_profit_pct: 0.12
  trailing_stop_pct: 0.10

# --- 仓位模型 + 再平衡 (本版本新增) ---
portfolio:
  weight_model: score_weight
  score_column: rsi_2
  volatility_column: null
  rebalance_interval_days: 5              # 每 5 日重新分配仓位

# --- 评估配置 ---
evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
