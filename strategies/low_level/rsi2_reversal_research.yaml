experiment:
  name: rsi2_reversal_research_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    rsi_2: factors.stock_daily_momentum_close.rsi_2

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 120
  min_amount: null

signal:
  type: expression
  entry: rsi_2 < 10
  exit: rsi_2 > 70

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
