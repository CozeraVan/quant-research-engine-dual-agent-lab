# =============================================================================
# RSI2 超卖反转 — 基础版
# =============================================================================
# 策略类型: 均值回归 (mean_reversion)
# 难度: ★☆☆☆☆ (入门)
# 说明: RSI(2) < 10 买入, RSI(2) > 70 卖出。最简版本，无风控，无权重。
# 对应高层入口: strategies/high_level/rsi2_oversold_reversal_entry.yaml
#   编译命令: uv run qre compile strategies/high_level/rsi2_oversold_reversal_entry.yaml
# =============================================================================

experiment:
  name: rsi2_reversal_research_mvp
  market_profile: ashare_daily_default   # A 股日线市场规则
  frequency: daily
  objective: screen_then_validate        # 先筛选再验证

# --- 数据源 ---
data:
  market_table: public.stock_daily       # 行情表
  factor_schema: factors                 # 因子 schema
  market_fields:                         # 需要的行情字段
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:                         # 需要的因子列 (table.column 路径)
    rsi_2: factors.stock_daily_momentum_close.rsi_2   # 2 周期 RSI

# --- 标的范围 ---
universe:
  market: ashare
  exclude_st: true                       # 排除 ST
  exclude_suspended: true                # 排除停牌
  min_listing_days: 120                  # 最少上市 120 天
  min_amount: null

# --- 交易信号 ---
signal:
  type: expression
  entry: rsi_2 < 10                      # RSI(2) 低于 10 时买入
  exit: rsi_2 > 70                       # RSI(2) 高于 70 时卖出

# --- 执行规则 ---
execution:
  signal_date: t                         # 信号日 = t 日
  entry_execution: t_plus_1_open         # t+1 开盘价入场
  exit_execution: t_plus_1_open          # t+1 开盘价离场

# --- 持仓限制 ---
holding:
  max_holding_days: 5                    # 最长持有 5 个交易日
  direction: long_only                   # 仅做多

# --- 评估配置 ---
evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]   # 前向收益周期
  quantiles: 5                                  # 分位数分组
  benchmarks:                                   # 基准对比
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
