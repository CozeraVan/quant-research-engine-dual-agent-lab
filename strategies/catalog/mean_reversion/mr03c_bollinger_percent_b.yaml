# =============================================================================
# 均值回归 — 布林带均值回归
# =============================================================================
# 策略 ID:     mr03c_bollinger_percent_b
# 策略名称:   布林 %b 极值回归
# 难度:       ★★☆☆☆ (2/5)
# 说明:       %b < 0 (价格完全在下轨以下) 入场，%b > 0.5 (回到中轴上方) 出场。
# 数据依赖:   BOLL(20/2.0)
# 入场规则:   close < bbl_20_2_0_2_0
# 出场规则:   close > bbm_20_2_0_2_0
# 持仓天数:   3 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: mr03c_bollinger_percent_b_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    bbu_20_2_0_2_0: factors.stock_daily_volatility_close.bbu_20_2_0_2_0
    bbm_20_2_0_2_0: factors.stock_daily_volatility_close.bbm_20_2_0_2_0
    bbl_20_2_0_2_0: factors.stock_daily_volatility_close.bbl_20_2_0_2_0

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: close < bbl_20_2_0_2_0
  exit: close > bbm_20_2_0_2_0

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 3
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
