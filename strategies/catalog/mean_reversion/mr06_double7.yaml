# =============================================================================
# 均值回归 — Double 7 双七策略
# =============================================================================
# 策略 ID:     mr06_double7
# 策略名称:   双七策略 Double 7
# 难度:       ★★☆☆☆ (2/5)
# 说明:       close > SMA(200) 且收盘创 7 日新低入场，创 7 日新高出场。大趋势向上时的短期超跌反弹。
# 数据依赖:   SMA(200)
# 入场规则:   (close > sma_200) & (close < close.shift(7))
# 出场规则:   close > close.shift(1).rolling(7).max()
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: mr06_double7_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_200: factors.stock_daily_overlap_close.sma_200

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > sma_200) & (close < close.shift(7))
  exit: close > close.shift(1).rolling(7).max()

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
