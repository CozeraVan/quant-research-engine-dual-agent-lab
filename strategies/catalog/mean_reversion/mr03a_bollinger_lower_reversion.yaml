# =============================================================================
# 均值回归 — 布林带均值回归
# =============================================================================
# 策略 ID:     mr03a_bollinger_lower_reversion
# 策略名称:   布林下轨回归 BOLL(20,2)
# 难度:       ★☆☆☆☆ (1/5)
# 说明:       close < 布林下轨入场，回到中轨出场。价格偏离统计均值后回归中心。
# 数据依赖:   BOLL(20/2.0) + RSI(14)
# 入场规则:   (close < bbl_20_2_0_2_0) & (rsi_14 < 40)
# 出场规则:   close > bbm_20_2_0_2_0
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: mr03a_bollinger_lower_reversion_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    bbu_20_2_0_2_0: factors.stock_daily_volatility_close.bbu_20_2_0_2_0
    bbm_20_2_0_2_0: factors.stock_daily_volatility_close.bbm_20_2_0_2_0
    bbl_20_2_0_2_0: factors.stock_daily_volatility_close.bbl_20_2_0_2_0
    rsi_14: factors.stock_daily_momentum_close.rsi_14

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close < bbl_20_2_0_2_0) & (rsi_14 < 40)
  exit: close > bbm_20_2_0_2_0

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
