# =============================================================================
# 均值回归 — KDJ / Stochastic 极值反转（扩展变体）
# =============================================================================
# 策略 ID:     mr02b_stochastic_cross
# 策略名称:   Stochastic %K/%D 超卖金叉
# 难度:       ★★☆☆☆ (2/5)
# 说明:       %K 在 20 以下上穿 %D 入场，80 以上死叉出场。用 Williams %R 近似。
# 数据依赖:   WILLIAMS_R(14) + SMA(50)
# 入场规则:   (willr_14 > -80) & (willr_14 > willr_14.shift(1)) & (close > sma_50)
# 出场规则:   willr_14 > -20
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: mr02b_stochastic_cross_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    willr_14: factors.stock_daily_momentum_close.willr_14
    sma_50: factors.stock_daily_overlap_close.sma_50

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (willr_14 > -80) & (willr_14 > willr_14.shift(1)) & (close > sma_50)
  exit: willr_14 > -20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
