# =============================================================================
# 均值回归 — MFI 量价反转
# =============================================================================
# 策略 ID:     mr08a_mfi_oversold_reversal
# 策略名称:   MFI 超卖反转
# 难度:       ★★☆☆☆ (2/5)
# 说明:       MFI < 20 后重新站回 20 入场（需确认 MFI 因子列）。用 RSI + 量比近似。
# 数据依赖:   RSI(14) + SMA(60)
# 入场规则:   (rsi_14 < 30) & (close > sma_60) & (rsi_14 > rsi_14.shift(1))
# 出场规则:   rsi_14 > 60
# 持仓天数:   5 天
# 方向:       long_only
# 备注:       MFI 用 RSI 超卖 + 价格 > SMA 近似；需确认 MFI 因子列。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: mr08a_mfi_oversold_reversal_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    rsi_14: factors.stock_daily_momentum_close.rsi_14
    sma_60: factors.stock_daily_overlap_close.sma_60

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (rsi_14 < 30) & (close > sma_60) & (rsi_14 > rsi_14.shift(1))
  exit: rsi_14 > 60

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
