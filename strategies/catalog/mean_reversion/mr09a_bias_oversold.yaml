# =============================================================================
# 均值回归 — 均线偏离与缩量止跌
# =============================================================================
# 策略 ID:     mr09a_bias_oversold
# 策略名称:   均线偏离 BIAS 超卖回归
# 难度:       ★★☆☆☆ (2/5)
# 说明:       偏离 MA(20) 超过 -5% 且当日收阳入场，回归到 -1% 上方出场。
# 数据依赖:   SMA(20)
# 入场规则:   ((close - sma_20) / sma_20 < -0.05) & (close > open)
# 出场规则:   (close - sma_20) / sma_20 > -0.01
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: mr09a_bias_oversold_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: ((close - sma_20) / sma_20 < -0.05) & (close > open)
  exit: (close - sma_20) / sma_20 > -0.01

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
