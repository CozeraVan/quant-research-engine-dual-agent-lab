# =============================================================================
# 量价 — 量价流量扩展（扩展变体）
# =============================================================================
# 策略 ID:     pv05b_daily_vwap_support
# 策略名称:   日线 VWAP 连续站上
# 难度:       ★★★☆☆ (3/5)
# 说明:       连续两日收盘高于日线 VWAP（需确认 VWAP 因子列）。用两日连阳量增近似。
# 数据依赖:   SMA(5)
# 入场规则:   (close > open) & (close.shift(1) > open.shift(1)) & (vol > vol.shift(1)) & (close > sma_5)
# 出场规则:   close < sma_5
# 持仓天数:   3 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: pv05b_daily_vwap_support_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_5: factors.stock_daily_overlap_close.sma_5

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > open) & (close.shift(1) > open.shift(1)) & (vol > vol.shift(1)) & (close > sma_5)
  exit: close < sma_5

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 3
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
