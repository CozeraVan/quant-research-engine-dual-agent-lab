# =============================================================================
# 量价 — 量价流量扩展（扩展变体）
# =============================================================================
# 策略 ID:     pv05d_eom_ease_of_movement
# 策略名称:   EOM 轻松移动上穿零轴
# 难度:       ★★★☆☆ (3/5)
# 说明:       EOM 上穿 0 入场（需确认 EOM 因子列）。用价格 + 量比方向近似。
# 数据依赖:   SMA(20)
# 入场规则:   (close > open) & (vol > vol.shift(1)) & (close > sma_20)
# 出场规则:   close < sma_20
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: pv05d_eom_ease_of_movement_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > open) & (vol > vol.shift(1)) & (close > sma_20)
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
