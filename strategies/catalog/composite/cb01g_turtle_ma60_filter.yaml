# =============================================================================
# 组合增强 — 多信号共振模板
# =============================================================================
# 策略 ID:     cb01g_turtle_ma60_filter
# 策略名称:   海龟突破 + MA60 过滤
# 难度:       ★★☆☆☆ (2/5)
# 说明:       突破 20 日高点且价格 > MA(60) 入场，跌破 10 日低点出场。
# 数据依赖:   SMA(60)
# 入场规则:   (close > close.shift(1).rolling(20).max()) & (close > sma_60)
# 出场规则:   close < close.shift(1).rolling(10).min()
# 持仓天数:   10 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: cb01g_turtle_ma60_filter_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_60: factors.stock_daily_overlap_close.sma_60

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > close.shift(1).rolling(20).max()) & (close > sma_60)
  exit: close < close.shift(1).rolling(10).min()

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
