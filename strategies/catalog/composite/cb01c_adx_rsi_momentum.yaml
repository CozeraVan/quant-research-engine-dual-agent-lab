# =============================================================================
# 组合增强 — 多信号共振模板（扩展变体）
# =============================================================================
# 策略 ID:     cb01c_adx_rsi_momentum
# 策略名称:   ADX趋势+RSI动量
# 难度:       ★★★☆☆ (3/5)
# 说明:       ADX>25 + RSI(14)>50 入场。趋势明确且动量确认。
# 数据依赖:   ADX(14) + RSI(14)
# 入场规则:   (adx_14 > 25) & (rsi_14 > 50)
# 出场规则:   (adx_14 < 20) | (rsi_14 < 45)
# 持仓天数:   10 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: cb01c_adx_rsi_momentum_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    adx_14: factors.stock_daily_trend_close.adx_14
    rsi_14: factors.stock_daily_momentum_close.rsi_14

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (adx_14 > 25) & (rsi_14 > 50)
  exit: (adx_14 < 20) | (rsi_14 < 45)

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
