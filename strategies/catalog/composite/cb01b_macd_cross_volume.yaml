# =============================================================================
# 组合增强 — 多信号共振模板（扩展变体）
# =============================================================================
# 策略 ID:     cb01b_macd_cross_volume
# 策略名称:   MACD金叉+放量
# 难度:       ★★☆☆☆ (2/5)
# 说明:       MACD金叉且放量确认入场。双条件减少假突破噪音。
# 数据依赖:   MACD(12/26/9)
# 入场规则:   (macd_12_26_9 > macds_12_26_9) & (vol > vol.shift(1).rolling(20).mean())
# 出场规则:   macd_12_26_9 < macds_12_26_9
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: cb01b_macd_cross_volume_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    macd_12_26_9: factors.stock_daily_momentum_close.macd_12_26_9
    macds_12_26_9: factors.stock_daily_momentum_close.macds_12_26_9

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (macd_12_26_9 > macds_12_26_9) & (vol > vol.shift(1).rolling(20).mean())
  exit: macd_12_26_9 < macds_12_26_9

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
