# =============================================================================
# 突破 — 波动率压缩与释放（扩展变体）
# =============================================================================
# 策略 ID:     bo08e_amplitude_expansion
# 策略名称:   振幅扩张率突破
# 难度:       ★★★☆☆ (3/5)
# 说明:       今日振幅 / 5 日均振幅显著放大并收阳入场。
# 数据依赖:   SMA(10)
# 入场规则:   ((high - low) / low > 1.5 * (high.shift(1).rolling(5).mean() - low.shift(1).rolling(5).mean()) / low.shift(1).rolling(5).mean()) & (close > open) & (close > sma_10)
# 出场规则:   close < sma_10
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: bo08e_amplitude_expansion_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_10: factors.stock_daily_overlap_close.sma_10

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: ((high - low) / low > 1.5 * (high.shift(1).rolling(5).mean() - low.shift(1).rolling(5).mean()) / low.shift(1).rolling(5).mean()) & (close > open) & (close > sma_10)
  exit: close < sma_10

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
