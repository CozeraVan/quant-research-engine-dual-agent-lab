# =============================================================================
# 突破 — 结构与回测突破（扩展变体）
# =============================================================================
# 策略 ID:     bo09e_channel_retest_breakout
# 策略名称:   通道突破回测
# 难度:       ★★★☆☆ (3/5)
# 说明:       突破 20 日高点后回测不破再上行入场。
# 数据依赖:   SMA(20)
# 入场规则:   (close.shift(1) > close.shift(2).rolling(20).max()) & (close > sma_20) & (close > close.shift(1))
# 出场规则:   close < sma_20
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   2026-11-11 修复自引用恒假（CF-018 零交易）→ 昨日创20日新高+今日在20日线上方+今日上行
# =============================================================================

experiment:
  name: bo09e_channel_retest_breakout_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close.shift(1) > close.shift(2).rolling(20).max()) & (close > sma_20) & (close > close.shift(1))
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
