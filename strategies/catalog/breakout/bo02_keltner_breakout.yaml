# =============================================================================
# 突破 — Keltner 通道突破
# =============================================================================
# 策略 ID:     bo02_keltner_breakout
# 策略名称:   Keltner 通道突破 EMA(20)+2*ATR(10)
# 难度:       ★★★☆☆ (3/5)
# 说明:       close > EMA(20) + 2*ATR(10) 入场，跌回通道内出场。ATR 通道过滤毛刺。
# 数据依赖:   EMA(20) + ATR(10)
# 入场规则:   (close > ema_20) & (close > ema_20.shift(1))
# 出场规则:   close < ema_20
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: bo02_keltner_breakout_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    ema_20: factors.stock_daily_overlap_close.ema_20
    atr_10: factors.stock_daily_volatility_close.atr_10

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > ema_20) & (close > ema_20.shift(1))
  exit: close < ema_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
