# =============================================================================
# 突破 — Bollinger Squeeze 收缩后突破
# =============================================================================
# 策略 ID:     bo05_bollinger_squeeze
# 策略名称:   布林带收缩突破 Bollinger Squeeze
# 难度:       ★★★☆☆ (3/5)
# 说明:       布林带宽度压缩后价格放量向上突破上轨入场，跌回中轨出场。波动率循环策略。
# 数据依赖:   BOLL(20/2.0) + SMA(20)
# 入场规则:   (close > bbu_20_2_0_2_0) & (close > sma_20)
# 出场规则:   close < bbm_20_2_0_2_0
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: bo05_bollinger_squeeze_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    bbu_20_2_0_2_0: factors.stock_daily_volatility_close.bbu_20_2_0_2_0
    bbm_20_2_0_2_0: factors.stock_daily_volatility_close.bbm_20_2_0_2_0
    bbl_20_2_0_2_0: factors.stock_daily_volatility_close.bbl_20_2_0_2_0
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > bbu_20_2_0_2_0) & (close > sma_20)
  exit: close < bbm_20_2_0_2_0

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
