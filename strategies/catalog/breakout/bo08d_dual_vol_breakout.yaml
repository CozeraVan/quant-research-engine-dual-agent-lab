# =============================================================================
# 突破 — 波动率压缩与释放
# =============================================================================
# 策略 ID:     bo08d_dual_vol_breakout
# 策略名称:   双重波动率突破
# 难度:       ★★★☆☆ (3/5)
# 说明:       创 10 日新高且 SMA(60) 斜率转正入场。趋势与波动共振。
# 数据依赖:   SMA(20,60)
# 入场规则:   (close > close.shift(1).rolling(10).max()) & (sma_60 > sma_60.shift(5))
# 出场规则:   close < sma_20
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: bo08d_dual_vol_breakout_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20
    sma_60: factors.stock_daily_overlap_close.sma_60

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > close.shift(1).rolling(10).max()) & (sma_60 > sma_60.shift(5))
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
