# =============================================================================
# 截面因子 — 因子工厂 mined factor（M5c 闭环验证）
# =============================================================================
# 策略 ID:     cs07c_mf003_alpha082_low_mvp
# 因子来源:   cluster.mined_factors MF_003（M3b 跨年度加固存活，综合分第 3 名）
# 条件语义:   alpha082 截面分位≤20%
# M3b 证据:   跨年 11 年 / regime 2/3 / 一致率 70%
#             / +5 超额 +3.74% / 平均池 845
# 实现方式:   QRE DSL 不支持截面分位 → cluster-ashare 用共享 executor
#             （src.factor_executor.condition_mask，M3b 同款语义）逐日全市场
#             物化 0/1 标志到 cluster.mined_factor_flags，本策略直接寻址
#             cluster.mined_factor_flags.mf_003，entry 为行内等值比较。
# 入场规则:   mf_003 == 1（T 日信号，T+1 开盘成交）
# 出场规则:   持有满 5 日（对齐 M3b +5 窗口）或止损触发
# 持仓天数:   5 天
# 方向:       long_only
# 校验状态:   M5c 沙箱冒烟
# =============================================================================

experiment:
  name: cs07c_mf003_alpha082_low_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: cluster
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    mf_003: cluster.mined_factor_flags.mf_003

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: mf_003 == 1

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
