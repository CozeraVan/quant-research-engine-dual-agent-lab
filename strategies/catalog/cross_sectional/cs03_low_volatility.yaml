# =============================================================================
# 截面因子 — 低波动因子
# =============================================================================
# 策略 ID:     cs03_low_volatility
# 策略名称:   低波动因子筛选
# 难度:       ★★★☆☆ (3/5)
# 说明:       做多过去20/60/120日波动率较低的一组。用波动率收缩+均线过滤近似。
# 数据依赖:   SMA(20,200)
# 入场规则:   (close > sma_200) & (close > sma_20)
# 出场规则:   close < sma_20
# 持仓天数:   20 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: cs03_low_volatility_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20
    sma_200: factors.stock_daily_overlap_close.sma_200

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > sma_200) & (close > sma_20)
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 20
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
