# =============================================================================
# 截面因子 — 小市值扩展家族
# =============================================================================
# 策略 ID:     cs01c_small_cap_macd_timing
# 策略名称:   小市值+MACD择时
# 难度:       ★★★★☆ (4/5)
# 说明:       MACD多头区间持有小市值。
# 数据依赖:   MACD(12/26/9) + SMA(20,60)
# 入场规则:   (macd_12_26_9 > macds_12_26_9) & (close > sma_20)
# 出场规则:   macd_12_26_9 < macds_12_26_9
# 持仓天数:   20 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: cs01c_small_cap_macd_timing_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    macd_12_26_9: factors.stock_daily_momentum_close.macd_12_26_9
    macds_12_26_9: factors.stock_daily_momentum_close.macds_12_26_9
    sma_20: factors.stock_daily_overlap_close.sma_20
    sma_60: factors.stock_daily_overlap_close.sma_60

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (macd_12_26_9 > macds_12_26_9) & (close > sma_20)
  exit: macd_12_26_9 < macds_12_26_9

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 20
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
