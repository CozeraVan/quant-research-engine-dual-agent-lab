# =============================================================================
# 截面因子 — Size+Value 双因子排序
# =============================================================================
# 策略 ID:     cs02_size_value_ranking
# 策略名称:   Size+Value排序
# 难度:       ★★★★☆ (4/5)
# 说明:       size+value双因子打分选综合排名靠前组。用均线+RSI低吸近似。
# 数据依赖:   RSI(14) + SMA(60,200)
# 入场规则:   (rsi_14 < 40) & (close > sma_200) & (close > sma_60)
# 出场规则:   rsi_14 > 65
# 持仓天数:   20 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: cs02_size_value_ranking_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    rsi_14: factors.stock_daily_momentum_close.rsi_14
    sma_60: factors.stock_daily_overlap_close.sma_60
    sma_200: factors.stock_daily_overlap_close.sma_200

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (rsi_14 < 40) & (close > sma_200) & (close > sma_60)
  exit: rsi_14 > 65

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 20
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
