# =============================================================================
# K线形态 — 底部反转形态（扩展变体）
# =============================================================================
# 策略 ID:     pt01c_morning_star
# 策略名称:   早晨之星
# 难度:       ★★★★☆ (4/5)
# 说明:       三 K 线结构：阴线+小实体+阳线收复首根 50% 以上。用三日反转近似。
# 数据依赖:   SMA(20)
# 入场规则:   (close > open) & (close.shift(1) < open.shift(1)) & (close > close.shift(2)) & (close > sma_20)
# 出场规则:   close < sma_20
# 持仓天数:   3 天
# 方向:       long_only
# 备注:       早晨之星需精细K线识别；此处用简化三日反转模式近似。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: pt01c_morning_star_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > open) & (close.shift(1) < open.shift(1)) & (close > close.shift(2)) & (close > sma_20)
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 3
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
