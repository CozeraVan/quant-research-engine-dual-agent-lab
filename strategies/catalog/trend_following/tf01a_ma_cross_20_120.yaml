# =============================================================================
# 趋势跟踪 — 移动平均趋势系统
# =============================================================================
# 策略 ID:     tf01a_ma_cross_20_120
# 策略名称:   双均线金叉 MA20/MA120
# 难度:       ★★☆☆☆ (2/5)
# 说明:       MA(20) 上穿 MA(120) 入场，下穿出场。经典中长期趋势跟踪。
# 数据依赖:   SMA(20,120)
# 入场规则:   sma_20 > sma_120
# 出场规则:   sma_20 < sma_120
# 持仓天数:   20 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf01a_ma_cross_20_120_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20
    sma_120: factors.stock_daily_overlap_close.sma_120

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: sma_20 > sma_120
  exit: sma_20 < sma_120

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 20
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
