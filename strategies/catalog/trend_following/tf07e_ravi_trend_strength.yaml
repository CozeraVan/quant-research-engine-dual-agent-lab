# =============================================================================
# 趋势跟踪 — 另类趋势指标家族
# =============================================================================
# 策略 ID:     tf07e_ravi_trend_strength
# 策略名称:   RAVI 趋势强度
# 难度:       ★★★☆☆ (3/5)
# 说明:       RAVI > 3% 且价格在 MA(20) 之上入场。用 SMA(7) / SMA(65) 偏离近似。
# 数据依赖:   SMA(7,20,65)
# 入场规则:   ((sma_7 / sma_65 - 1).abs() > 0.03) & (close > sma_20)
# 出场规则:   close < sma_20
# 持仓天数:   10 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf07e_ravi_trend_strength_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_7: factors.stock_daily_overlap_close.sma_7
    sma_20: factors.stock_daily_overlap_close.sma_20
    sma_65: factors.stock_daily_overlap_close.sma_65

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: ((sma_7 / sma_65 - 1).abs() > 0.03) & (close > sma_20)
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
