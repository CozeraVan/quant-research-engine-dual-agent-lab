# =============================================================================
# 趋势跟踪 — 另类趋势指标家族
# =============================================================================
# 策略 ID:     tf07a_aroon_trend_confirm
# 策略名称:   Aroon 趋势确认
# 难度:       ★★★☆☆ (3/5)
# 说明:       AroonUp > 70 且 AroonDown < 30 入场（需确认 Aroon 因子列）。用通道突破近似。
# 数据依赖:   SMA(60)
# 入场规则:   (close > close.shift(1).rolling(25).max()) & (close > sma_60)
# 出场规则:   close < sma_60
# 持仓天数:   10 天
# 方向:       long_only
# 备注:       Aroon 用创 N 日新高近似；需确认 Aroon 因子列后替换。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf07a_aroon_trend_confirm_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_60: factors.stock_daily_overlap_close.sma_60

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > close.shift(1).rolling(25).max()) & (close > sma_60)
  exit: close < sma_60

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
