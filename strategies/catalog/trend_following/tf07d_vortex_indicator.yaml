# =============================================================================
# 趋势跟踪 — 另类趋势指标家族
# =============================================================================
# 策略 ID:     tf07d_vortex_indicator
# 策略名称:   Vortex 涡旋指标 +VI/-VI
# 难度:       ★★★☆☆ (3/5)
# 说明:       +VI 上穿 -VI 入场（需确认 Vortex 因子列）。用均线金叉近似。
# 数据依赖:   EMA(12,26)
# 入场规则:   ema_12 > ema_26
# 出场规则:   ema_12 < ema_26
# 持仓天数:   10 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf07d_vortex_indicator_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    ema_12: factors.stock_daily_overlap_close.ema_12
    ema_26: factors.stock_daily_overlap_close.ema_26

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: ema_12 > ema_26
  exit: ema_12 < ema_26

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
