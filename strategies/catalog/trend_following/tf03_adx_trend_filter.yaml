# =============================================================================
# 趋势跟踪 — ADX 趋势过滤
# =============================================================================
# 策略 ID:     tf03_adx_trend_filter
# 策略名称:   ADX 趋势过滤器 +DI/-DI
# 难度:       ★★★☆☆ (3/5)
# 说明:       +DI > -DI 且 ADX > 25 且 ADX 上升入场，+DI < -DI 出场。只在趋势明确时持有。
# 数据依赖:   ADX(14) + SMA(20)
# 入场规则:   (adx_14 > 25) & (close > sma_20)
# 出场规则:   (adx_14 < 20) | (close < sma_20)
# 持仓天数:   10 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf03_adx_trend_filter_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    adx_14: factors.stock_daily_trend_close.adx_14
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (adx_14 > 25) & (close > sma_20)
  exit: (adx_14 < 20) | (close < sma_20)

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
