# =============================================================================
# 趋势跟踪 — 移动平均趋势系统
# =============================================================================
# 策略 ID:     tf01c_sma200_bull_filter
# 策略名称:   200日均线牛熊过滤
# 难度:       ★★☆☆☆ (2/5)
# 说明:       close > SMA(200) 且 SMA(20) 向上拐头入场，跌破 SMA(200) 出场。
# 数据依赖:   SMA(20,200)
# 入场规则:   (close > sma_200) & (sma_20 > sma_20.shift(1))
# 出场规则:   close < sma_200
# 持仓天数:   20 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf01c_sma200_bull_filter_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20
    sma_200: factors.stock_daily_overlap_close.sma_200

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > sma_200) & (sma_20 > sma_20.shift(1))
  exit: close < sma_200

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 20
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
