# =============================================================================
# 趋势跟踪 — 另类动量中轴家族
# =============================================================================
# 策略 ID:     tf08b_dsi_zero_cross
# 策略名称:   DSI 动力指标零轴突破
# 难度:       ★★★☆☆ (3/5)
# 说明:       DSI 上穿 0 入场（需确认 DSI 因子列）。用 RSI 方向近似。
# 数据依赖:   RSI(14)
# 入场规则:   rsi_14 > 55
# 出场规则:   rsi_14 < 45
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf08b_dsi_zero_cross_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    rsi_14: factors.stock_daily_momentum_close.rsi_14

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: rsi_14 > 55
  exit: rsi_14 < 45

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
