# =============================================================================
# 趋势跟踪 — MACD 动量系统（扩展变体）
# =============================================================================
# 策略 ID:     tf02c_macd_histogram_slope
# 策略名称:   MACD 柱状图斜率反转
# 难度:       ★★★☆☆ (3/5)
# 说明:       MACD 柱状图在负值区连续 3 天缩短，配合 RSI(14) 超卖入场。
# 数据依赖:   MACD(12/26/9) + RSI(14)
# 入场规则:   (macd_12_26_9 > macd_12_26_9.shift(1)) & (rsi_14 < 40)
# 出场规则:   macd_12_26_9 < macds_12_26_9
# 持仓天数:   5 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf02c_macd_histogram_slope_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    macd_12_26_9: factors.stock_daily_momentum_close.macd_12_26_9
    macds_12_26_9: factors.stock_daily_momentum_close.macds_12_26_9
    rsi_14: factors.stock_daily_momentum_close.rsi_14

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (macd_12_26_9 > macd_12_26_9.shift(1)) & (rsi_14 < 40)
  exit: macd_12_26_9 < macds_12_26_9

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 5
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
