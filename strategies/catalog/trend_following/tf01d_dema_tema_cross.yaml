# =============================================================================
# 趋势跟踪 — 移动平均趋势系统（扩展变体）
# =============================================================================
# 策略 ID:     tf01d_dema_tema_cross
# 策略名称:   DEMA/TEMA 响应策略
# 难度:       ★★★☆☆ (3/5)
# 说明:       DEMA(20) 上穿 DEMA(60) 入场，下穿出场。双指数平滑，减少滞后。
# 数据依赖:   EMA(20,60)
# 入场规则:   ema_20 > ema_60
# 出场规则:   ema_20 < ema_60
# 持仓天数:   10 天
# 方向:       long_only
# 备注:       DEMA/TEMA 用 EMA 近似；DMA 调用需确认列名。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf01d_dema_tema_cross_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    ema_20: factors.stock_daily_overlap_close.ema_20
    ema_60: factors.stock_daily_overlap_close.ema_60

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: ema_20 > ema_60
  exit: ema_20 < ema_60

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
