# =============================================================================
# 趋势跟踪 — 移动平均趋势系统
# =============================================================================
# 策略 ID:     tf01h_wma_cross_5_20
# 策略名称:   WMA加权均线交叉 WMA5/WMA20
# 难度:       ★★☆☆☆ (2/5)
# 说明:       WMA(5) 上穿 WMA(20) 入场，下穿出场。
# 数据依赖:   WMA(5,20)
# 入场规则:   wma_5 > wma_20
# 出场规则:   wma_5 < wma_20
# 持仓天数:   10 天
# 方向:       long_only

# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf01h_wma_cross_5_20_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    wma_5: factors.stock_daily_overlap_close.wma_5
    wma_20: factors.stock_daily_overlap_close.wma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: wma_5 > wma_20
  exit: wma_5 < wma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
