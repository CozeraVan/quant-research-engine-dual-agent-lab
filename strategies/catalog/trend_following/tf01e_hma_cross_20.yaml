# =============================================================================
# 趋势跟踪 — 移动平均趋势系统（扩展变体）
# =============================================================================
# 策略 ID:     tf01e_hma_cross_20
# 策略名称:   HMA 赫尔均线变色
# 难度:       ★★★☆☆ (3/5)
# 说明:       HMA(20) 由下转上入场，向下拐头出场。赫尔均线低延迟。
# 数据依赖:   SMA(20)
# 入场规则:   (sma_20 > sma_20.shift(1)) & (close > sma_20)
# 出场规则:   sma_20 < sma_20.shift(1)
# 持仓天数:   10 天
# 方向:       long_only
# 备注:       HMA 用 SMA(20) 方向变化近似；HMA 列名需确认。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf01e_hma_cross_20_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (sma_20 > sma_20.shift(1)) & (close > sma_20)
  exit: sma_20 < sma_20.shift(1)

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
