# =============================================================================
# 趋势跟踪 — 绝对动量 / 双动量
# =============================================================================
# 策略 ID:     tf06a_dual_momentum
# 策略名称:   绝对动量 + 相对动量筛选
# 难度:       ★★★★☆ (4/5)
# 说明:       过去 60 日收益为正，且 MA(5) > MA(20) 确认趋势入场。
# 数据依赖:   SMA(5,20)
# 入场规则:   (close > close.shift(60)) & (sma_5 > sma_20)
# 出场规则:   close < sma_20
# 持仓天数:   20 天
# 方向:       long_only
# 备注:       简化版双动量：正收益 + MA趋势。完整版需截面排名引擎。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf06a_dual_momentum_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    sma_5: factors.stock_daily_overlap_close.sma_5
    sma_20: factors.stock_daily_overlap_close.sma_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (close > close.shift(60)) & (sma_5 > sma_20)
  exit: close < sma_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 20
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
