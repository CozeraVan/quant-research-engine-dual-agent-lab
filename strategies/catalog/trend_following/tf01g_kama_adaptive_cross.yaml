# =============================================================================
# 趋势跟踪 — 移动平均趋势系统（扩展变体）
# =============================================================================
# 策略 ID:     tf01g_kama_adaptive_cross
# 策略名称:   KAMA 自适应均线交叉
# 难度:       ★★★☆☆ (3/5)
# 说明:       KAMA(10,2,30) 上穿 KAMA(20,2,30) 入场，下穿出场。自适应调整平滑系数。
# 数据依赖:   EMA(10,20)
# 入场规则:   ema_10 > ema_20
# 出场规则:   ema_10 < ema_20
# 持仓天数:   10 天
# 方向:       long_only
# 备注:       KAMA 用 EMA 近似；需确认 KAMA 列名后替换表达式。
# 生成工具:   scripts/generate_strategy_yamls.py
# 校验状态:   待数据库因子验证
# =============================================================================

experiment:
  name: tf01g_kama_adaptive_cross_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    ema_10: factors.stock_daily_overlap_close.ema_10
    ema_20: factors.stock_daily_overlap_close.ema_20

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: ema_10 > ema_20
  exit: ema_10 < ema_20

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 10
  direction: long_only

risk:
  stop_loss_pct: 0.08
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
