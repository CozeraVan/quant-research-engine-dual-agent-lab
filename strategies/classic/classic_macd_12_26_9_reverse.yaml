# =============================================================================
# 经典策略 — MACD(12,26,9) 反向择时（QRE-SAAS-SHOWCASE 重新填充用）
# =============================================================================
# 策略 ID:     classic_macd_12_26_9_reverse
# 策略名称:   MACD 反向择时
# 数据依赖:   factors.stock_daily_momentum_close.macd_12_26_9 / macds_12_26_9
# 入场规则:   MACD 快线下穿信号线（今日 < 且昨日 >=）——与金叉策略反向
# 出场规则:   MACD 快线上穿信号线（今日 > 且昨日 <=）
# 成交规则:   T 日收盘出信号 → T+1 开盘价成交
# 持仓天数:   0 = 不限
# 方向:       long_only
# 说明:       作为金叉策略的对照组，用于观察同一因子反向信号在全A全期的表现。
# =============================================================================

experiment:
  name: classic_macd_12_26_9_reverse
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    macd: factors.stock_daily_momentum_close.macd_12_26_9
    macd_signal: factors.stock_daily_momentum_close.macds_12_26_9

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (macd < macd_signal) & (macd.shift(1) >= macd_signal.shift(1))
  exit: (macd > macd_signal) & (macd.shift(1) <= macd_signal.shift(1))

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 0
  direction: long_only

risk:
  stop_loss_pct: null
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
