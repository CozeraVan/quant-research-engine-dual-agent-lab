# =============================================================================
# 经典策略 — EMA5/EMA200 双均线趋势跟踪（QRE-SAAS-SHOWCASE 重新填充用）
# =============================================================================
# 策略 ID:     classic_ema_5_200_golden_cross
# 策略名称:   EMA5/200 金叉死叉
# 数据依赖:   factors.stock_daily_overlap_typical_price.ema_5 / ema_200
# 入场规则:   EMA5 上穿 EMA200（今日 > 且昨日 <=）
# 出场规则:   EMA5 下穿 EMA200（今日 < 且昨日 >=）
# 成交规则:   T 日收盘出信号 → T+1 开盘价成交
# 持仓天数:   0 = 不限
# 方向:       long_only
# 说明:       ema_200 在库内只有 typical_price 口径，为保持两条均线同一价格口径，
#             这里 ema_5 也显式使用 typical_price，不混用 close 与 typical_price。
# =============================================================================

experiment:
  name: classic_ema_5_200_golden_cross
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    ema_5: factors.stock_daily_overlap_typical_price.ema_5
    ema_200: factors.stock_daily_overlap_typical_price.ema_200

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120

signal:
  type: expression
  entry: (ema_5 > ema_200) & (ema_5.shift(1) <= ema_200.shift(1))
  exit: (ema_5 < ema_200) & (ema_5.shift(1) >= ema_200.shift(1))

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 0
  direction: long_only

risk:
  stop_loss_pct: null
  take_profit_pct: null
  trailing_stop_pct: null

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
