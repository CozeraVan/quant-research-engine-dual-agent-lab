{% extends "base.html" %}
{% block title %}新建回测 · A股回测台{% endblock %}
{% block body %}
<div class="container">
  <div class="topbar">
    <div class="brand">新建回测</div>
    <div><a href="/saas/">返回我的回测</a></div>
  </div>
  <div class="panel">
    <div class="tabs">
      <button class="tab active" id="tab-nl" data-tab="nl" type="button">自然语言 <span class="opt">人人可用</span></button>
      <button class="tab" id="tab-wizard" data-tab="wizard" type="button">快速向导 <span class="opt">从因子库挑条件</span></button>
    </div>

    <div id="pane-nl">
      <h2>用一句话描述你的策略</h2>
      <textarea id="nl-input" rows="4" placeholder="例：5日均线上穿200日均线买入，下穿卖出，止损8%"></textarea>
      <div class="chips" id="nl-examples" style="margin:8px 0 12px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn-sm nl-example">RSI 低于 30 买入，高于 70 卖出</button>
        <button type="button" class="btn-sm nl-example">股价跌破布林下轨买入，回到中轨卖出</button>
        <button type="button" class="btn-sm nl-example">MACD 金叉买入，死叉卖出</button>
      </div>
      <button class="btn" id="btn-nl-compile" type="button">生成策略</button>
      <span id="nl-status" class="muted" style="margin-left:8px"></span>
    </div>

    <div id="pane-wizard" class="hidden">
      <h2>快速向导：从因子库挑条件</h2>
      <div class="row">
        <div>
          <label for="wz-group">因子类别</label>
          <select id="wz-group"><option value="">加载中…</option></select>
        </div>
        <div>
          <label for="wz-factor">因子</label>
          <select id="wz-factor"><option value="">先选类别</option></select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="wz-entry-op">买入条件：因子值</label>
          <select id="wz-entry-op"><option value="<=">低于（超跌买入）</option><option value=">=">高于（强势买入）</option></select>
        </div>
        <div>
          <label for="wz-entry-val">阈值</label>
          <input id="wz-entry-val" type="number" value="30" step="any">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="wz-exit-op">卖出条件：因子值</label>
          <select id="wz-exit-op"><option value=">=">高于（止盈/超买卖出）</option><option value="<=">低于</option></select>
        </div>
        <div>
          <label for="wz-exit-val">阈值</label>
          <input id="wz-exit-val" type="number" value="70" step="any">
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn" id="btn-wz-build" type="button">生成策略</button>
        <span id="wz-status" class="muted" style="margin-left:8px"></span>
      </div>
    </div>

    <details class="hidden" id="yaml-details" style="margin-top:14px">
      <summary>策略代码预览（高级）</summary>
      <textarea id="yaml-preview" class="code" rows="12" style="margin-top:8px"></textarea>
    </details>
  </div>

  <div class="panel hidden" id="run-card">
    <h2>回测设置</h2>
    <details>
      <summary>高级选项（回测区间 / 资金量，有默认值）</summary>
      <div class="row" style="margin-top:8px">
        <div><label for="opt-start">开始日期</label><input id="opt-start" type="date"></div>
        <div><label for="opt-end">结束日期</label><input id="opt-end" type="date"></div>
        <div><label for="opt-cash">资金量（元）</label><input id="opt-cash" type="number" value="1000000"></div>
      </div>
    </details>
    <div style="margin-top:16px">
      <button class="btn big" id="btn-submit" type="button">开始回测</button>
      <span id="run-status" class="muted" style="margin-left:10px"></span>
    </div>
    <div id="run-error" class="error"></div>
  </div>

  <div id="factor-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50">
    <div class="panel" style="max-width:420px;width:90%;margin:0">
      <h2>当前因子库暂不支持</h2>
      <p id="factor-modal-list" style="font-size:14px"></p>
      <p class="muted">你可以：<br>① 换个策略试试（多数常见指标已支持）<br>② 把缺的因子提交给我们——需求集中的因子会优先计算入库</p>
      <div class="row" style="margin-top:12px">
        <div><button class="btn ghost" id="btn-factor-close" style="width:100%">换个策略</button></div>
        <div><button class="btn" id="btn-factor-submit" style="width:100%">提交因子需求</button></div>
      </div>
      <div id="factor-modal-status" class="muted" style="margin-top:8px"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
requireLogin();

// --- tab 切换 ---
let activeTab = 'nl';
for (const tab of document.querySelectorAll('.tab')){
  tab.addEventListener('click', () => {
    activeTab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    document.getElementById('pane-nl').classList.toggle('hidden', activeTab !== 'nl');
    document.getElementById('pane-wizard').classList.toggle('hidden', activeTab !== 'wizard');
  });
}

for (const chip of document.querySelectorAll('.nl-example')){
  chip.addEventListener('click', () => { document.getElementById('nl-input').value = chip.textContent; });
}

// --- 默认区间：近 2 年 ---
(function(){
  const end = new Date();
  const start = new Date(end.getFullYear() - 2, end.getMonth(), end.getDate());
  const iso = d => d.toISOString().slice(0, 10);
  document.getElementById('opt-end').value = iso(end);
  document.getElementById('opt-start').value = iso(start);
})();

function currentYaml(){ return document.getElementById('yaml-preview').value.trim(); }
function showYaml(text){
  document.getElementById('yaml-details').classList.remove('hidden');
  document.getElementById('yaml-preview').value = text;
  document.getElementById('run-card').classList.remove('hidden');
  document.getElementById('run-status').textContent = '';
  document.getElementById('run-error').textContent = '';
}

// --- NL 生成 ---
document.getElementById('btn-nl-compile').addEventListener('click', async () => {
  const description = document.getElementById('nl-input').value.trim();
  if (!description) return;
  const status = document.getElementById('nl-status');
  status.textContent = '正在生成策略…';
  const resp = await apiFetch('/api/saas/nl/compile', {json: {description}});
  const data = await resp.json();
  if (!data.ok){
    if (data.code === 'missing_factors' && (data.missing_factors || []).length){
      openFactorModal(data.missing_factors);
      status.textContent = '';
      return;
    }
    status.textContent = data.error || '生成失败，请换个说法试试';
    return;
  }
  status.textContent = (data.warnings || []).join('；') || '生成成功，可以开始回测';
  showYaml(data.yaml);
});

// --- 快速向导：因子目录 ---
let factorGroups = [];
async function loadFactors(){
  const resp = await apiFetch('/api/saas/factors');
  const data = await resp.json();
  const groupSel = document.getElementById('wz-group');
  if (!data.ok){ groupSel.innerHTML = '<option value="">因子库暂不可用</option>'; return; }
  factorGroups = data.groups;
  groupSel.innerHTML = factorGroups.map((g, i) => `<option value="${i}">${g.label}</option>`).join('');
  fillFactors(0);
}
function fillFactors(gi){
  const items = (factorGroups[gi] || {}).items || [];
  document.getElementById('wz-factor').innerHTML =
    items.map((it, i) => `<option value="${i}">${it.label}</option>`).join('');
}
document.getElementById('wz-group').addEventListener('change', e => fillFactors(Number(e.target.value)));
loadFactors();

document.getElementById('btn-wz-build').addEventListener('click', () => {
  const g = factorGroups[Number(document.getElementById('wz-group').value)];
  const item = (g.items || [])[Number(document.getElementById('wz-factor').value)];
  if (!item) return;
  const entryOp = document.getElementById('wz-entry-op').value;
  const entryVal = document.getElementById('wz-entry-val').value;
  const exitOp = document.getElementById('wz-exit-op').value;
  const exitVal = document.getElementById('wz-exit-val').value;
  let fields, ref;
  if (item.table === 'public.stock_daily'){
    fields = '  market_fields: [open, high, low, close, pre_close, vol, amount]';
    ref = item.column;
  } else {
    fields = `  market_fields: [open, high, low, close, pre_close, vol, amount]\n  factor_fields:\n    f0: ${item.table}.${item.column}`;
    ref = 'f0';
  }
  const yaml = `experiment:\n  name: wizard_${item.column}\ndata:\n${fields}\nsignal:\n  entry: (${ref} ${entryOp} ${entryVal})\n  exit: (${ref} ${exitOp} ${exitVal})\nevaluation:\n  forward_return_horizons: [1, 3, 5, 10, 20]\nholding:\n  max_holding_days: 20\nrisk:\n  stop_loss_pct: 0.08\n`;
  document.getElementById('wz-status').textContent = '已生成，可以开始回测';
  showYaml(yaml);
});

// --- 缺因子申请模态框 ---
let pendingFactors = [];
function openFactorModal(factors){
  pendingFactors = factors;
  document.getElementById('factor-modal-list').textContent = '缺失因子：' + factors.join('、');
  document.getElementById('factor-modal-status').textContent = '';
  const btn = document.getElementById('btn-factor-submit');
  btn.disabled = false;
  btn.textContent = '提交因子需求';
  document.getElementById('factor-modal').classList.remove('hidden');
}
document.getElementById('btn-factor-close').addEventListener('click', () =>
  document.getElementById('factor-modal').classList.add('hidden'));
document.getElementById('btn-factor-submit').addEventListener('click', async () => {
  const btn = document.getElementById('btn-factor-submit');
  btn.disabled = true;
  const status = document.getElementById('factor-modal-status');
  const resp = await apiFetch('/api/saas/factor-requests', {json: {
    factors: pendingFactors,
    strategy_name: document.getElementById('nl-input').value.trim().slice(0, 50),
  }});
  const data = await resp.json();
  if (resp.ok && data.ok){
    btn.textContent = '已提交，我们会评估';
    status.textContent = '可在「我的回测」页底部查看审核进度';
  } else {
    status.textContent = data.error || '提交失败';
    btn.disabled = false;
  }
});

// --- 开始回测：后台先跑小范围预检，通过后自动提交正式回测 ---
async function createJob(kind){
  const yaml = currentYaml();
  if (!yaml){ document.getElementById('run-error').textContent = '请先生成策略'; return null; }
  const resp = await apiFetch('/api/saas/jobs', {json: {
    yaml, kind,
    params: {
      start: document.getElementById('opt-start').value,
      end: document.getElementById('opt-end').value,
      initial_cash: Number(document.getElementById('opt-cash').value) || 1000000,
    },
  }});
  const data = await resp.json();
  if (!resp.ok || !data.ok){
    throw new Error(data.error || '提交失败');
  }
  return data.job_id;
}
async function pollJob(jobId){
  for (;;){
    await new Promise(r => setTimeout(r, 3000));
    const resp = await apiFetch('/api/saas/jobs/' + jobId);
    const data = await resp.json();
    const status = data.job && data.job.status;
    if (status === 'done') return data.job;
    if (status === 'failed' || status === 'cancelled') throw new Error(data.job.error || '任务失败');
  }
}

document.getElementById('btn-submit').addEventListener('click', async () => {
  const btn = document.getElementById('btn-submit');
  const status = document.getElementById('run-status');
  const errBox = document.getElementById('run-error');
  errBox.textContent = '';
  btn.disabled = true;
  try {
    status.textContent = '正在小范围验证策略（通常 1 分钟内）…';
    const smokeId = await createJob('smoke');
    if (smokeId === null) return;
    try {
      await pollJob(smokeId);
    } catch (e) {
      errBox.textContent = '策略在小样本上没跑通：' + e.message;
      status.textContent = '';
      return;
    }
    status.textContent = '验证通过，正在提交正式回测…';
    const fullId = await createJob('full');
    if (fullId === null) return;
    location.href = '/saas/jobs/' + fullId;
  } catch (e) {
    errBox.textContent = e.message;
    status.textContent = '';
  } finally {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
