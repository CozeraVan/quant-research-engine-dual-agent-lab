{% extends "base.html" %}
{% block title %}经典策略 · A股回测台 | 经典量化策略全市场全期回测成绩，每日更新{% endblock %}
{% block body %}
<div class="wrap">
  <div class="page-head">
    <h1>经典策略 <button type="button" class="tip-trigger" data-tip="只读展示 · 数据每日收盘后更新 · 过往表现不构成投资建议。" aria-label="经典策略说明">?</button></h1>
    <p>经典量化策略在全 A 股、全历史区间的真实回测成绩，随每日数据更新持续跟踪。</p>
    <!-- 公开 verified 判断只在服务端执行，页面不展示结果合同与验证标签。 -->
  </div>
  <div class="card">
    <div class="row" style="align-items:center;margin-bottom:14px">
      <input id="sc-search" type="search" placeholder="搜索策略名称" aria-label="搜索策略名称">
      <select id="sc-filter" aria-label="收益筛选"><option value="all">全部策略</option><option value="profit">正收益</option><option value="excess">正超额</option></select>
      <button class="btn btn-primary" id="sc-compare" type="button" disabled>对比所选</button>
    </div>
    <div class="table-wrap" style="max-height:720px;overflow:auto">
    <table class="tbl" id="sc-table">
      <thead><tr>
        <th>选择</th>
        <th aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="title">策略</button></th>
        <th aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="date_start">回测区间</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="total_return">总收益率</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="excess_return">超额收益</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="max_drawdown">最大回撤</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="win_rate">胜率</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="total_trade_count">交易笔数</button></th>
        <th>日更状态</th>
        <th aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="data_until">数据截至</button></th>
      </tr></thead>
      <tbody id="sc-tbody"><tr><td colspan="10" class="muted">加载中…</td></tr></tbody>
    </table>
    </div>
    <div class="profile-pager">
      <button class="btn-sm" id="sc-prev" type="button">← 上一页</button>
      <span class="profile-pager-pages" id="sc-pages"></span>
      <span class="profile-pager-info" id="sc-info"></span>
      <button class="btn-sm" id="sc-next" type="button">下一页 →</button>
    </div>
  </div>

  <div class="card showcase-cta">
    <h2 style="font-size:17px">复现经典策略 <button type="button" class="tip-trigger" data-tip="以上策略均可在「新建策略」页自由复现：用自然语言描述，或用自选因子组合生成同款策略，再按自己的区间与标的范围回测验证。" aria-label="复现经典策略说明">?</button></h2>
    <a class="btn btn-primary" href="/saas/new">新建同款策略</a>
  </div>
  <div class="modal-mask" id="sc-compare-modal" role="dialog" aria-modal="true" aria-labelledby="sc-compare-title">
    <div class="modal" style="max-width:1200px;overflow:auto">
      <h2 id="sc-compare-title">经典策略对比</h2>
      <div id="sc-compare-body"></div>
      <button class="btn btn-ghost" id="sc-compare-close" type="button">关闭</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(v, digits){
  if (v == null || isNaN(v)) return '—';
  const p = (v * 100).toFixed(digits == null ? 2 : digits) + '%';
  return v > 0 ? '+' + p : p;
}
function cls(v){ return v == null ? 'flat' : (v > 0 ? 'pos' : (v < 0 ? 'neg' : 'flat')); }
const scState = {items: [], sort: null, order: 'desc', page: 1, pageSize: 20, selected: []};
const SC_TEXT_KEYS = new Set(['title', 'date_start', 'data_until']);
function scSortItems(items){
  if (!scState.sort) return items.slice();
  const key = scState.sort, direction = scState.order === 'asc' ? 1 : -1;
  return items.slice().sort((a, b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (SC_TEXT_KEYS.has(key)) return String(av).localeCompare(String(bv), 'zh-CN') * direction;
    return (Number(av) - Number(bv)) * direction;
  });
}
function scVisibleItems(){
  const query = document.getElementById('sc-search').value.trim().toLowerCase();
  const filter = document.getElementById('sc-filter').value;
  return scState.items.filter(it => (!query || (it.title + ' ' + (it.subtitle || '')).toLowerCase().includes(query)) &&
    (filter === 'all' || (filter === 'profit' && it.total_return > 0) || (filter === 'excess' && it.excess_return > 0)));
}
function scRenderPager(total){
  const pages = Math.max(1, Math.ceil(total / scState.pageSize));
  scState.page = Math.min(Math.max(1, scState.page), pages);
  document.getElementById('sc-info').textContent = `第 ${scState.page} / ${pages} 页 · 共 ${total} 条`;
  document.getElementById('sc-prev').disabled = scState.page <= 1;
  document.getElementById('sc-next').disabled = scState.page >= pages;
  const box = document.getElementById('sc-pages');
  box.replaceChildren();
  const start = Math.max(1, Math.min(scState.page - 2, pages - 4)), end = Math.min(pages, start + 4);
  for (let page = start; page <= end; page++){
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'btn-sm profile-page-btn' + (page === scState.page ? ' is-on' : '');
    btn.textContent = String(page); btn.disabled = page === scState.page;
    btn.addEventListener('click', () => { scState.page = page; renderShowcase(); }); box.appendChild(btn);
  }
}
function renderCompare(){
  const selected = scState.items.filter(it => scState.selected.includes(it.job_id));
  document.getElementById('sc-compare-body').innerHTML = '<table class="tbl"><thead><tr><th>策略</th><th>总收益</th><th>超额</th><th>最大回撤</th><th>胜率</th><th>交易笔数</th></tr></thead><tbody>' +
    selected.map(it => '<tr><td>' + esc(it.title) + '</td><td class="num">' + pct(it.total_return) + '</td><td class="num">' + pct(it.excess_return) + '</td><td class="num">' + pct(it.max_drawdown) + '</td><td class="num">' + pct(it.win_rate) + '</td><td class="num">' + it.total_trade_count + '</td></tr>').join('') + '</tbody></table>';
  document.getElementById('sc-compare-modal').classList.add('show');
}
function renderShowcase(){
  const sorted = scSortItems(scVisibleItems());
  scRenderPager(sorted.length);
  const start = (scState.page - 1) * scState.pageSize, visible = sorted.slice(start, start + scState.pageSize);
  const tbody = document.getElementById('sc-tbody');
  tbody.innerHTML = visible.map(it => {
    const range = (it.date_start || '—') + ' ~ ' + (it.date_end || '—');
    const sub = it.subtitle ? '<div class="opt" style="font-size:14px;margin-top:6px">' + esc(it.subtitle) + '</div>' : '';
    const checked = scState.selected.includes(it.job_id) ? ' checked' : '';
    return '<tr style="cursor:pointer" onclick="location.href=\'/saas/jobs/' + it.job_id + '\'">' +
      '<td><input type="checkbox" data-sc-select="' + it.job_id + '" aria-label="选择对比" onclick="event.stopPropagation()"' + checked + '></td>' +
      '<td><strong>' + esc(it.title) + '</strong>' + sub + '</td><td style="white-space:nowrap">' + esc(range) + '</td>' +
      '<td class="num ' + cls(it.total_return) + '" style="text-align:right">' + pct(it.total_return) + '</td>' +
      '<td class="num ' + cls(it.excess_return) + '" style="text-align:right">' + pct(it.excess_return) + '</td>' +
      '<td class="num neg" style="text-align:right">' + (it.max_drawdown == null ? '—' : pct(it.max_drawdown)) + '</td>' +
      '<td class="num" style="text-align:right">' + (it.win_rate == null ? '—' : pct(it.win_rate)) + '</td>' +
      '<td class="num" style="text-align:right">' + (it.total_trade_count == null ? '—' : it.total_trade_count) + '</td>' +
      '<td>' + (it.tracking_days > 0 ? '日更 ' + it.tracking_days + ' 天' : '基线') + '</td>' +
      '<td style="white-space:nowrap">' + esc(it.data_until || '—') + '</td></tr>';
  }).join('');
  tbody.querySelectorAll('[data-sc-select]').forEach(box => box.addEventListener('change', () => {
    const id = Number(box.dataset.scSelect);
    scState.selected = box.checked ? [...scState.selected, id] : scState.selected.filter(x => x !== id);
    if (scState.selected.length > 4){ scState.selected = scState.selected.filter(x => x !== id); box.checked = false; }
    document.getElementById('sc-compare').disabled = scState.selected.length < 2;
  }));
  document.querySelectorAll('[data-sc-sort]').forEach(btn => {
    const active = btn.dataset.scSort === scState.sort, label = btn.textContent.replace(/ [▲▼]$/, '');
    btn.textContent = label + (active ? (scState.order === 'desc' ? ' ▼' : ' ▲') : '');
    btn.classList.toggle('active', active);
    const th = btn.closest('th');
    if (th) th.setAttribute('aria-sort', active ? (scState.order === 'desc' ? 'descending' : 'ascending') : 'none');
  });
}
document.querySelectorAll('[data-sc-sort]').forEach(btn => btn.addEventListener('click', () => {
  const key = btn.dataset.scSort;
  if (scState.sort === key) scState.order = scState.order === 'desc' ? 'asc' : 'desc';
  else { scState.sort = key; scState.order = 'desc'; }
  scState.page = 1; renderShowcase();
}));
document.getElementById('sc-prev').addEventListener('click', () => { if (scState.page > 1){ scState.page--; renderShowcase(); } });
document.getElementById('sc-next').addEventListener('click', () => { scState.page++; renderShowcase(); });
document.getElementById('sc-search').addEventListener('input', () => { scState.page = 1; renderShowcase(); });
document.getElementById('sc-filter').addEventListener('change', () => { scState.page = 1; renderShowcase(); });
document.getElementById('sc-compare').addEventListener('click', renderCompare);
document.getElementById('sc-compare-close').addEventListener('click', () => document.getElementById('sc-compare-modal').classList.remove('show'));
async function loadShowcase(){
  const tbody = document.getElementById('sc-tbody');
  try {
    const resp = await apiFetch('/api/saas/showcase'), d = await resp.json();
    if (!d.ok || !d.items.length){ tbody.innerHTML = '<tr><td colspan="10" class="muted">暂无展示策略</td></tr>'; return; }
    scState.items = d.items; renderShowcase();
  } catch (e) { tbody.innerHTML = '<tr><td colspan="10" class="muted">加载失败，请刷新重试</td></tr>'; }
}
loadShowcase();
</script>
{% endblock %}
