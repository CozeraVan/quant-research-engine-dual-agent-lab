{% extends "base.html" %}
{% block title %}经典策略 · A股回测台 | 经典量化策略全市场全期回测成绩，每日更新{% endblock %}
{% block body %}
<div class="wrap">
  <div class="page-head">
    <h1>经典策略 <button type="button" class="tip-trigger" data-tip="只读展示 · 数据每日收盘后更新 · 过往表现不构成投资建议。" aria-label="经典策略说明">?</button></h1>
    <p>经典量化策略在全 A 股、全历史区间的真实回测成绩，随每日数据更新持续跟踪。</p>
    <!-- 公开 verified 判断只在服务端执行，页面不展示结果合同与验证标签。 -->
  </div>
  <div class="card">
    <div class="table-wrap">
    <table class="tbl" id="sc-table">
      <thead><tr>
        <th aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="title">策略</button></th>
        <th aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="date_start">回测区间</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="total_return">总收益率</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="excess_return">超额收益</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="max_drawdown">最大回撤</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="win_rate">胜率</button></th>
        <th class="num" style="text-align:right" aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="total_trade_count">交易笔数</button></th>
        <th aria-sort="none"><button type="button" class="seg-btn" data-sc-sort="data_until">数据截至</button></th>
      </tr></thead>
      <tbody id="sc-tbody"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
    </table>
    </div>
  </div>

  <div class="card showcase-cta">
    <h2 style="font-size:17px">复现经典策略 <button type="button" class="tip-trigger" data-tip="以上策略均可在「新建策略」页自由复现：用自然语言描述，或用自选因子组合生成同款策略，再按自己的区间与标的范围回测验证。" aria-label="复现经典策略说明">?</button></h2>
    <a class="btn btn-primary" href="/saas/new">新建同款策略</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(v, digits){
  if (v == null || isNaN(v)) return '—';
  const p = (v * 100).toFixed(digits == null ? 2 : digits) + '%';
  return v > 0 ? '+' + p : p;
}
function cls(v){ return v == null ? 'flat' : (v > 0 ? 'pos' : (v < 0 ? 'neg' : 'flat')); }
const scState = {items: [], sort: null, order: 'desc'};
const SC_TEXT_KEYS = new Set(['title', 'date_start', 'data_until']);
function scSortItems(items){
  if (!scState.sort) return items.slice();
  const key = scState.sort;
  const direction = scState.order === 'asc' ? 1 : -1;
  return items.slice().sort((a, b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (SC_TEXT_KEYS.has(key)) return String(av).localeCompare(String(bv), 'zh-CN') * direction;
    return (Number(av) - Number(bv)) * direction;
  });
}
function renderShowcase(){
  const tbody = document.getElementById('sc-tbody');
  tbody.innerHTML = scSortItems(scState.items).map(it => {
    const range = (it.date_start || '—') + ' ~ ' + (it.date_end || '—');
    const sub = it.subtitle ? '<div class="opt" style="font-size:14px;margin-top:6px">' + esc(it.subtitle) + '</div>' : '';
    return '<tr style="cursor:pointer" onclick="location.href=\'/saas/jobs/' + it.job_id + '\'">' +
      '<td><strong>' + esc(it.title) + '</strong>' + sub + '</td>' +
      '<td style="white-space:nowrap">' + esc(range) + '</td>' +
      '<td class="num ' + cls(it.total_return) + '" style="text-align:right">' + pct(it.total_return) + '</td>' +
      '<td class="num ' + cls(it.excess_return) + '" style="text-align:right">' + pct(it.excess_return) + '</td>' +
      '<td class="num neg" style="text-align:right">' + (it.max_drawdown == null ? '—' : (it.max_drawdown * 100).toFixed(2) + '%') + '</td>' +
      '<td class="num" style="text-align:right">' + (it.win_rate == null ? '—' : (it.win_rate * 100).toFixed(1) + '%') + '</td>' +
      '<td class="num" style="text-align:right">' + (it.total_trade_count == null ? '—' : it.total_trade_count) + '</td>' +
      '<td style="white-space:nowrap">' + esc(it.data_until || '—') + '</td>' +
    '</tr>';
  }).join('');
  document.querySelectorAll('[data-sc-sort]').forEach(btn => {
    const active = btn.dataset.scSort === scState.sort;
    const label = btn.textContent.replace(/ [▲▼]$/, '');
    btn.textContent = label + (active ? (scState.order === 'desc' ? ' ▼' : ' ▲') : '');
    btn.classList.toggle('active', active);
    const th = btn.closest('th');
    if (th) th.setAttribute('aria-sort', active
      ? (scState.order === 'desc' ? 'descending' : 'ascending') : 'none');
  });
}
document.querySelectorAll('[data-sc-sort]').forEach(btn => btn.addEventListener('click', () => {
  const key = btn.dataset.scSort;
  if (scState.sort === key) scState.order = scState.order === 'desc' ? 'asc' : 'desc';
  else { scState.sort = key; scState.order = 'desc'; }
  renderShowcase();
}));
async function loadShowcase(){
  const tbody = document.getElementById('sc-tbody');
  try {
    const resp = await apiFetch('/api/saas/showcase');
    const d = await resp.json();
    if (!d.ok || !d.items.length){
      tbody.innerHTML = '<tr><td colspan="8" class="muted">暂无展示策略</td></tr>';
      return;
    }
    scState.items = d.items;
    renderShowcase();
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="8" class="muted">加载失败，请刷新重试</td></tr>';
  }
}
loadShowcase();
</script>
{% endblock %}
