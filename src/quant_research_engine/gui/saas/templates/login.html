{% extends "base.html" %}
{% block title %}登录 · A股回测台{% endblock %}
{% block body %}
<div class="container" style="max-width:420px;margin-top:8vh">
  <div class="card">
    <h1 style="text-align:center">A股回测台</h1>
    <p class="muted" style="text-align:center">验证你的交易策略能否在 A 股赚钱</p>
    <label for="login-target">邮箱（或手机号）</label>
    <input id="login-target" type="text" placeholder="you@example.com" autocomplete="username">
    <div class="row" style="margin-top:12px;align-items:flex-end">
      <div>
        <label for="login-code">验证码</label>
        <input id="login-code" type="text" placeholder="6 位数字" maxlength="6" autocomplete="one-time-code">
      </div>
      <div style="flex:0 0 auto">
        <button class="btn secondary" id="btn-send-code">获取验证码</button>
      </div>
    </div>
    <div id="login-error" class="error"></div>
    <button class="btn big" id="btn-login" style="width:100%;margin-top:16px">登录 / 注册</button>
    <p class="muted" style="text-align:center;margin-top:16px">首次登录自动创建账号</p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
if (saasToken()) location.href = '/saas/';  // 已登录直接进工作台

const errBox = document.getElementById('login-error');
function fail(msg){ errBox.textContent = msg; }

document.getElementById('btn-send-code').addEventListener('click', async () => {
  errBox.textContent = '';
  const target = document.getElementById('login-target').value.trim();
  if (!target) return fail('请先填写邮箱或手机号');
  const btn = document.getElementById('btn-send-code');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/saas/auth/code', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target}),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) return fail(data.error || '发送失败，请稍后再试');
    let left = 60;
    btn.textContent = left + 's 后重发';
    const timer = setInterval(() => {
      left -= 1;
      if (left <= 0){ clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
      else btn.textContent = left + 's 后重发';
    }, 1000);
  } catch (e) {
    btn.disabled = false;
    fail('网络异常，请稍后再试');
  }
});

document.getElementById('btn-login').addEventListener('click', async () => {
  errBox.textContent = '';
  const target = document.getElementById('login-target').value.trim();
  const code = document.getElementById('login-code').value.trim();
  if (!target || !code) return fail('请填写邮箱/手机号和验证码');
  const resp = await fetch('/api/saas/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({target, code}),
  });
  const data = await resp.json();
  if (!resp.ok || !data.ok) return fail(data.error || '登录失败');
  localStorage.setItem(SAAS_TOKEN_KEY, data.token);
  location.href = '/saas/';
});
</script>
{% endblock %}
