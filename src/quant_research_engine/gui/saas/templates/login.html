{% extends "base.html" %}
{% block title %}登录 · A股回测台{% endblock %}
{% block body %}
<div class="container" style="max-width:420px;margin-top:8vh">
  <div class="card">
    <h1 style="text-align:center">A股回测台</h1>
    <p class="muted" style="text-align:center">验证你的交易策略能否在 A 股赚钱</p>
    <div class="tabs" style="justify-content:center">
      <button class="tab active" id="tab-login" type="button">登录</button>
      <button class="tab" id="tab-register" type="button">注册</button>
    </div>
    <label for="login-target">邮箱</label>
    <input id="login-target" type="email" placeholder="you@example.com" autocomplete="username">
    <label for="login-code">密码</label>
    <input id="login-code" type="password" placeholder="至少 8 位，含字母和数字" autocomplete="current-password">
    <div id="login-error" class="error"></div>
    <button class="btn big" id="btn-login" style="width:100%;margin-top:16px">登录</button>
    <p class="muted" style="text-align:center;margin-top:16px">内测期使用邮箱+密码（正式版将接入认证服务）<br>游客免登录：可直接在「新建回测」提交单支股票、近 2 年的回测（每日 1 次，结果次日清空）</p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
if (saasToken()) location.href = '/saas/';  // 已登录直接进工作台

let mode = 'login';
const errBox = document.getElementById('login-error');
function fail(msg){ errBox.textContent = msg; }
const btnLogin = document.getElementById('btn-login');
document.getElementById('tab-login').addEventListener('click', () => {
  mode = 'login'; errBox.textContent = '';
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-register').classList.remove('active');
  btnLogin.textContent = '登录';
});
document.getElementById('tab-register').addEventListener('click', () => {
  mode = 'register'; errBox.textContent = '';
  document.getElementById('tab-register').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  btnLogin.textContent = '注册并登录';
});

btnLogin.addEventListener('click', async () => {
  errBox.textContent = '';
  const target = document.getElementById('login-target').value.trim();
  const code = document.getElementById('login-code').value;
  if (!target || !code) return fail('请填写邮箱和密码');
  const url = mode === 'register' ? '/api/saas/auth/register' : '/api/saas/auth/login';
  const body = mode === 'register' ? {email: target, password: code} : {target, code};
  const resp = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok || !data.ok) return fail(data.error || (mode === 'register' ? '注册失败' : '登录失败'));
  localStorage.setItem(SAAS_TOKEN_KEY, data.token);
  location.href = '/saas/';
});
</script>
{% endblock %}
