{% extends "base.html" %}
{% block title %}回测结果 · A股回测台{% endblock %}
{% block body %}
<div class="container">
  <h1>回测结果 <span class="opt">任务 #{{ job_id }}</span></h1>
  <p class="brief-line" style="font-size:12px;color:#888;margin:4px 0 10px">📄 <span id="brief-text">加载中…</span></p>
  <div class="meta-chips" id="meta-chips"></div>

  <div class="panel" id="status-card">
    <span class="badge queued" id="job-badge">加载中</span>
    <span class="muted" id="job-status-note" style="margin-left:8px"></span>
  </div>

  <div id="result-area" class="hidden">
    <div class="metric-strip" id="metric-strip"></div>

    <div class="chart-box" id="box-main">
      <div class="chart-title">策略收益 vs 基准指数 <span class="opt">（累计收益率，全期起点 = 0%；拖动下方滑块或图上滚轮缩放区间）</span></div>
      <div class="bench-bar" id="bench-bar">基准：</div>
      <div id="chart-main" style="height:420px"></div>
      <div class="metric-strip" id="range-strip" style="margin-top:10px"></div>
    </div>

    <div class="chart-box" id="box-tags">
      <div class="chart-title">赚钱板块归因 <span class="opt">（矩块面积 = 盈亏规模，红赚绿亏、越深金额越大；点击矩块或下方榜单行看板块内个股）</span></div>
      <div class="tag-tabs" id="tag-tabs">
        <button data-layer="A" class="active">行业板块</button>
        <button data-layer="B">概念关键词</button>
        <button data-layer="C">技术标签</button>
      </div>
      <div id="chart-tags" style="height:420px"></div>
      <div id="tag-note" class="opt" style="font-size:12px"></div>
      <div class="tag-rank" id="tag-rank"></div>
      <div id="tag-detail" style="margin-top:10px"></div>
    </div>

    <!-- TODO(M4 OSS)：报告文件下载（明细走 OSS 直传） -->
    <div class="panel hidden" id="download-card"><a class="btn" id="btn-download">下载报告</a></div>
    <p><a href="/saas/">← 返回我的回测</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/echarts.min.js"></script>
<script>
requireLogin();
const JOB_ID = {{ job_id }};

function card(label, value, klass, tip){
  return '<div class="metric-card"' + (tip ? ' title="' + tip + '"' : '') + '><div class="m-label">' + label + '</div>' +
         '<div class="m-value ' + (klass || '') + '">' + value + '</div></div>';
}
function empty(id, msg){
  const el = document.getElementById(id);
  el.innerHTML = '<div class="chart-empty">' + (msg || '暂无数据') + '</div>';
  el.style.height = 'auto';
}
function chip(label, value){ return '<span class="chip">' + label + ' <b>' + value + '</b></span>'; }
function fmtPnl(v){ return (v >= 0 ? '+' : '') + Number(v).toFixed(2); }
function toRet(arr){  // 归一化为起点 0% 的累计收益率%
  const base = arr.find(v => v !== null && v !== undefined);
  return arr.map(v => (v === null || v === undefined || !base) ? null : (v / base - 1) * 100);
}

let mainChart = null, DATA = null, curBench = '';
function renderMetrics(m){
  const strip = document.getElementById('metric-strip');
  if (!m){ strip.innerHTML = ''; return; }
  strip.innerHTML =
    card('总收益率', pct(m.total_return ?? m.strategy_total_return), cls(m.total_return ?? m.strategy_total_return)) +
    card('年化收益', pct(m.annual_return), cls(m.annual_return), '全期总收益按回测起止区间几何年化：(1+总收益)^(1/年数)−1') +
    card('超额收益·vs持有不动', pct(m.excess_return), cls(m.excess_return), '策略全期总收益 − 同期买入并持有这些股票的收益；负值 = 跑输「装死持有」') +
    card('夏普比率', (m.sharpe == null ? '—' : Number(m.sharpe).toFixed(2)), cls(m.sharpe)) +
    card('最大回撤', pct(m.max_drawdown), 'neg') +
    card('胜率', pct(m.win_rate), cls(m.win_rate));
}
function renderMeta(meta, dataUntil){
  const el = document.getElementById('meta-chips');
  if (!meta){ el.innerHTML = ''; return; }
  const chips = [];
  if (meta.strategy_name) chips.push(chip('策略', meta.strategy_name));
  if (meta.date_start && meta.date_end) chips.push(chip('区间', meta.date_start + ' → ' + meta.date_end));
  if (meta.whole_market) chips.push(chip('标的', '全 A 股'));
  else if (meta.n_codes) chips.push(chip('标的', meta.n_codes + ' 只'));
  if (meta.initial_cash) chips.push(chip('初始资金', Number(meta.initial_cash).toLocaleString('zh-CN') + ' 元'));
  if (dataUntil) chips.push(chip('数据截止', dataUntil));
  el.innerHTML = chips.join('');
}
function renderMain(d){
  DATA = d;
  const dates = d.dates;
  const dd = (d.drawdown_pct || []).map(v => v == null ? null : v * 100);
  const hasDD = dd.some(v => v != null);
  mainChart = echarts.init(document.getElementById('chart-main'));
  const series = [{
    name: '策略', id: 'strategy', type: 'line', data: toRet(d.equity),
    showSymbol: false, lineStyle: {width: 2}, color: '#2563eb',
  }];
  if (hasDD) series.push({
    name: '回撤', id: 'dd', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: dd,
    showSymbol: false, areaStyle: {opacity: 0.35}, lineStyle: {width: 1}, color: '#d43030',
  });
  mainChart.setOption({
    animation: false,
    tooltip: {trigger: 'axis', axisPointer: {link: [{xAxisIndex: 'all'}]},
              valueFormatter: v => v == null ? '—' : Number(v).toFixed(2) + '%'},
    legend: {data: ['策略', '基准', '回撤'], top: 0},
    grid: hasDD
      ? [{left: 55, right: 20, top: 30, height: '52%'}, {left: 55, right: 20, top: '70%', height: '16%'}]
      : [{left: 55, right: 20, top: 30, height: '72%'}],
    xAxis: hasDD
      ? [{type: 'category', data: dates, gridIndex: 0, axisLabel: {show: false}},
         {type: 'category', data: dates, gridIndex: 1}]
      : [{type: 'category', data: dates, gridIndex: 0}],
    yAxis: hasDD
      ? [{type: 'value', gridIndex: 0, name: '累计收益率%', axisLabel: {formatter: '{value}%'}},
         {type: 'value', gridIndex: 1, name: '回撤%', max: 0, axisLabel: {formatter: '{value}%'}}]
      : [{type: 'value', gridIndex: 0, name: '累计收益率%', axisLabel: {formatter: '{value}%'} }],
    dataZoom: [
      {type: 'inside', xAxisIndex: hasDD ? [0, 1] : [0]},
      {type: 'slider', xAxisIndex: hasDD ? [0, 1] : [0], bottom: 6, height: 22},
    ],
    series,
  });
  const bar = document.getElementById('bench-bar');
  const benches = d.benchmarks || {};
  const codes = Object.keys(benches);
  bar.innerHTML = '基准：';
  if (!codes.length){
    bar.innerHTML += '<span class="opt">' + (d.benchmark_note || '暂无数据') + '</span>';
  } else {
    codes.forEach((code, i) => {
      const btn = document.createElement('button');
      btn.textContent = benches[code].name;
      btn.dataset.code = code;
      if (i === 0){ btn.className = 'active'; curBench = code; }
      btn.addEventListener('click', () => {
        curBench = code;
        bar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.code === code));
        applyBench();
      });
      bar.appendChild(btn);
    });
    applyBench();
  }
  window.addEventListener('resize', () => mainChart && mainChart.resize());
}
function applyBench(){
  if (!mainChart || !DATA) return;
  const benches = DATA.benchmarks || {};
  const ret = curBench && benches[curBench] ? toRet(benches[curBench].closes) : [];
  mainChart.setOption({series: [{
    name: '基准', id: 'bench', type: 'line', data: ret,
    showSymbol: false, lineStyle: {width: 1.5, type: 'dashed'}, color: '#f59e0b',
  }]});
}

// --- 赚钱板块归因（tag_analysis，数据为回传截断版：板块聚合全量 + 个股前/后各 50） ---
let tagChart = null, tagData = null, curLayer = 'A', curTag = null;
function pnlColor(pnl, maxAbs){
  const t = maxAbs > 0 ? Math.min(Math.abs(pnl) / maxAbs, 1) : 0;
  const light = [245, 245, 245];
  const deep = pnl >= 0 ? [212, 48, 48] : [26, 158, 75];
  const mix = light.map((c, i) => Math.round(c + (deep[i] - c) * (0.25 + 0.75 * t)));
  return 'rgb(' + mix.join(',') + ')';
}
function renderAttribution(attr){
  if (!attr || !attr.layers){ document.getElementById('box-tags').classList.add('hidden'); return; }
  tagData = attr;
  document.querySelectorAll('#tag-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      curLayer = btn.dataset.layer; curTag = null;
      document.querySelectorAll('#tag-tabs button').forEach(b => b.classList.toggle('active', b === btn));
      document.getElementById('tag-detail').innerHTML = '';
      renderTagChart();
    });
  });
  renderTagChart();
}
function renderTagChart(){
  const items = (tagData.layers[curLayer] || []).slice();
  const noteEl = document.getElementById('tag-note');
  const rankEl = document.getElementById('tag-rank');
  if (!items.length){
    noteEl.textContent = '';
    rankEl.innerHTML = '';
    empty('chart-tags', (tagData.notes && tagData.notes[curLayer]) || '暂无标签数据');
    return;
  }
  let noteText = '';
  if (curLayer === 'B' && tagData.filtered_count) noteText += '已过滤 ' + tagData.filtered_count + ' 个无效关键词。';
  const tmItems = items.slice(0, 20);
  if (items.length > 20) noteText += (noteText ? '　' : '') + '热力图仅显示前 20 个，共 ' + items.length + ' 个（完整见下表）。';
  noteEl.textContent = noteText;
  const maxAbs = Math.max.apply(null, tmItems.map(t => Math.abs(t.total_pnl)));
  const el = document.getElementById('chart-tags');
  el.style.height = '420px';
  if (!tagChart){
    tagChart = echarts.init(el);
    tagChart.getZr().on('click', e => {  // 点空白收起
      if (!e.target){ curTag = null; document.getElementById('tag-detail').innerHTML = ''; }
    });
    tagChart.on('click', p => { if (p.data && p.data.tagObj) drillDown(p.data.tagObj); });
  }
  tagChart.clear();
  tagChart.setOption({
    tooltip: {formatter: p => {
      const t = p.data.tagObj;
      return t.tag + '<br>总净盈亏 ' + fmtPnl(t.total_pnl) + ' 元' +
             '<br>平均每笔 ' + pct(t.avg_ret) +
             '<br>交易笔数 ' + t.trades + '　胜率 ' + pct(t.win_rate);
    }},
    series: [{
      type: 'treemap', roam: false, nodeClick: false, breadcrumb: {show: false},
      width: '100%', height: '100%',
      label: {show: true, fontSize: 12, formatter: p => p.data.tagObj.tag + '\n' + fmtPnl(p.data.tagObj.total_pnl)},
      itemStyle: {borderColor: '#fff', borderWidth: 2, gapWidth: 2},
      data: tmItems.map(t => ({
        name: t.tag, value: Math.abs(t.total_pnl) || 1, tagObj: t,
        itemStyle: {color: pnlColor(t.total_pnl, maxAbs)},
      })),
    }],
  });
  renderTagRank(items);
}
function drillDown(t){
  if (curTag === t.tag){ curTag = null; document.getElementById('tag-detail').innerHTML = ''; return; }
  curTag = t.tag;
  const syms = (t.symbols || []).slice().sort((a, b) => b.total_pnl - a.total_pnl);
  const note = t.symbols_truncated
    ? '<div class="opt" style="font-size:12px;margin-bottom:4px">共 ' + t.symbols_total + ' 只，仅显示盈亏前/后各 50</div>' : '';
  const rows = syms.map(s =>
    '<tr><td>' + s.ts_code + ' ' + (s.name || '') + '</td>' +
    '<td class="' + cls(s.total_pnl) + '" style="text-align:right">' + fmtPnl(s.total_pnl) + '</td>' +
    '<td style="text-align:right">' + s.trades + '</td>' +
    '<td style="text-align:right">' + pct(s.win_rate) + '</td>' +
    '<td class="' + cls(s.avg_ret) + '" style="text-align:right">' + pct(s.avg_ret) + '</td></tr>').join('');
  document.getElementById('tag-detail').innerHTML =
    '<div style="font-size:13px;font-weight:600;margin-bottom:4px">' + t.tag + ' · 个股贡献</div>' + note +
    '<table><thead><tr><th>股票</th><th style="text-align:right">总净盈亏(元)</th>' +
    '<th style="text-align:right">交易笔数</th><th style="text-align:right">胜率</th>' +
    '<th style="text-align:right">平均每笔</th></tr></thead><tbody>' + rows + '</tbody></table>';
}
function renderTagRank(items){
  const rows = items.map(t =>
    '<tr class="tag-row" data-tag="' + t.tag + '"><td>' + t.tag + '</td>' +
    '<td class="' + cls(t.total_pnl) + '" style="text-align:right">' + fmtPnl(t.total_pnl) + '</td>' +
    '<td style="text-align:right">' + t.trades + '</td>' +
    '<td class="' + cls(t.avg_ret) + '" style="text-align:right">' + pct(t.avg_ret) + '</td>' +
    '<td style="text-align:right">' + pct(t.win_rate) + '</td></tr>').join('');
  const el = document.getElementById('tag-rank');
  el.innerHTML = '<table><thead><tr><th>板块 / 标签（点击行看个股）</th>' +
    '<th style="text-align:right">总净盈亏(元)</th><th style="text-align:right">交易笔数</th>' +
    '<th style="text-align:right">平均每笔</th><th style="text-align:right">胜率</th></tr></thead><tbody>' + rows + '</tbody></table>';
  el.querySelectorAll('tr.tag-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const t = items.find(x => x.tag === tr.dataset.tag);
      if (t) drillDown(t);
    });
  });
}

// B3：数据源切到 B2 的 /api/results/<id> 系列端点（summary/chart-data/tag-analysis），
// 不再走 /api/saas/jobs 的嵌套 result。未完成 409（带 status）→ 显示进行状态并轮询。
async function poll(){
  const resp = await apiFetch('/api/results/' + JOB_ID + '/summary');
  const data = await resp.json();
  const badge = document.getElementById('job-badge');

  if (resp.status === 409){
    // 进行中：409 body 带真实 status
    const st = data.status || 'running';
    badge.className = 'badge ' + st;
    badge.textContent = STATUS_LABEL[st] || st;
    document.getElementById('job-status-note').textContent =
      st === 'queued' ? '任务排队中，空闲后即开始（每 5 秒自动刷新）' :
      st === 'failed' ? '任务失败：' + (data.error || '未知') :
      '正在回测，请稍候（每 5 秒自动刷新）';
    if (st !== 'failed') setTimeout(poll, 5000);
    return;
  }
  if (!resp.ok || !data.ok){
    badge.className = 'badge failed';
    badge.textContent = '加载失败';
    document.getElementById('job-status-note').textContent = data.error || ('HTTP ' + resp.status);
    return;
  }

  // 已完成：并行拉 chart-data 与 tag-analysis
  document.getElementById('status-card').classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  const [chartResp, tagResp] = await Promise.all([
    apiFetch('/api/results/' + JOB_ID + '/chart-data'),
    apiFetch('/api/results/' + JOB_ID + '/tag-analysis'),
  ]);
  const chart = (await chartResp.json()) || {};
  const tag = tagResp.ok ? await tagResp.json() : null;
  const brief = chart.brief || {};
  document.getElementById('brief-text').textContent = brief.name ? ('策略：' + brief.name) : (data.strategy_name ? ('策略：' + data.strategy_name) : '');
  renderMeta(chart.meta, data.data_until);
  renderMetrics(Object.assign({}, data.summary || {}, chart.metrics || {}));
  if (chart.dates && chart.equity) renderMain(chart);
  else empty('chart-main');
  renderAttribution(tag && tag.layers ? tag : (chart.tag_analysis || null));
}
poll();
</script>
{% endblock %}
