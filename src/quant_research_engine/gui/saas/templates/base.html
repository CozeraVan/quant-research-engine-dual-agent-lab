<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}A股回测台{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:20px;margin:8px 0 16px}
h2{font-size:16px;margin:0 0 12px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.big{font-size:17px;padding:14px 28px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px}
.badge.queued{background:#fef3c7;color:var(--amber)}
.badge.leased,.badge.running{background:#dbeafe;color:var(--accent)}
.badge.done{background:#dcfce7;color:var(--green)}
.badge.failed,.badge.cancelled{background:#fee2e2;color:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:500}
.error{color:var(--red);font-size:14px;margin-top:8px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
.chart{width:100%;height:320px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.metric .v{font-size:20px;font-weight:600;margin-top:4px}
.metric .v.pos{color:var(--red)}.metric .v.neg{color:var(--green)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px}
.topbar .brand{font-size:18px;font-weight:600}
.topbar a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;background:#fff}
.chip:hover{border-color:var(--accent);color:var(--accent)}
details{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:14px}
.hidden{display:none}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{padding:10px 20px;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
// 公共：token 存 localStorage；所有 API 带 Bearer；401 跳登录页
const SAAS_TOKEN_KEY = 'saas_token';
function saasToken(){ return localStorage.getItem(SAAS_TOKEN_KEY) || ''; }
async function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {'Authorization': 'Bearer ' + saasToken()});
  if (opts.json !== undefined){ opts.method = opts.method || 'POST'; opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(opts.json); delete opts.json; }
  const resp = await fetch(url, opts);
  if (resp.status === 401){ localStorage.removeItem(SAAS_TOKEN_KEY); location.href = '/saas/login'; throw new Error('unauthorized'); }
  return resp;
}
function requireLogin(){ if (!saasToken()) location.href = '/saas/login'; }
function pct(v){ return (v === null || v === undefined) ? '—' : (v * 100).toFixed(2) + '%'; }
function num(v){ return (v === null || v === undefined) ? '—' : Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 2}); }
const STATUS_LABEL = {queued:'排队中', leased:'运行中', running:'运行中', done:'已完成', failed:'失败', cancelled:'已取消'};
</script>
{% block scripts %}{% endblock %}
</body>
</html>
