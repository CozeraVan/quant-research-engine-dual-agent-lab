{% extends "base.html" %}
{% block title %}NL 编译质量 · A股回测台{% endblock %}
{% block body %}
<div class="wrap">
  <div class="page-head"><h1>NL 编译质量</h1><p>真实编译事件的成功率、缓存使用、失败分类与每日趋势。</p></div>
  <div class="metric-strip">
    <div class="metric-card"><div class="m-label">编译总数</div><div class="m-value" id="nq-total">—</div></div>
    <div class="metric-card"><div class="m-label">成功率</div><div class="m-value" id="nq-rate">—</div></div>
    <div class="metric-card"><div class="m-label">缓存命中</div><div class="m-value" id="nq-cache">—</div></div>
  </div>
  <div class="card"><h2>失败分类</h2><div id="nq-failures"></div></div>
  <div class="card"><h2>每日趋势（近14天）</h2><div id="nq-daily"></div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
function nqText(v){ return v == null ? '—' : String(v); }
async function loadNlQuality(){
  const response = await apiFetch('/api/saas/console/nl-quality');
  if (response.status === 401 || response.status === 403){ location.href = '/saas/login'; return; }
  const d = await response.json();
  document.getElementById('nq-total').textContent = nqText(d.total);
  document.getElementById('nq-rate').textContent = d.success_rate == null ? '—' : (d.success_rate * 100).toFixed(1) + '%';
  document.getElementById('nq-cache').textContent = nqText(d.cache_hits);
  document.getElementById('nq-failures').innerHTML = '<table class="tbl"><tbody>' + (d.top_failures || []).map(x => '<tr><td>' + nqText(x.error_class) + '</td><td class="num">' + x.count + '</td></tr>').join('') + '</tbody></table>';
  document.getElementById('nq-daily').innerHTML = '<table class="tbl"><thead><tr><th>日期</th><th>总数</th><th>成功</th></tr></thead><tbody>' + (d.daily || []).map(x => '<tr><td>' + nqText(x.day) + '</td><td>' + x.total + '</td><td>' + x.ok + '</td></tr>').join('') + '</tbody></table>';
}
loadNlQuality().catch((error) => {
  if (error && error.message === 'unauthorized'){ location.href = '/saas/login'; return; }
  document.getElementById('nq-total').textContent = '加载失败';
});
</script>
{% endblock %}
