<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我不是股神 · 匿名日线模拟交易</title>
<link rel="stylesheet" href="/static/lab-theme.css">
<style>
html,body{height:100%}
.wrap.game-shell{max-width:none;padding:12px 16px 14px}
.game-shell #game-start{max-width:560px;margin:0 auto}
.start-options{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.start-options label{display:flex;flex-direction:column;gap:4px;font-size:13px;flex:1;min-width:140px;color:var(--grey)}
.start-options select{height:38px;padding:4px 10px;font-size:14px;color:var(--ink)}
#game-main{height:calc(100dvh - 26px);min-height:520px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
.term-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;min-height:46px;padding:5px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1)}
.term-id{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:16px;font-weight:700;white-space:nowrap}
.term-id .code{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--grey);font-variant-numeric:tabular-nums}
#phase{font-size:13px;font-weight:600;color:var(--lav-deep);white-space:nowrap;font-variant-numeric:tabular-nums}
.term-bar .spacer{flex:1}
#finish-note{color:var(--lav-deep);font-weight:700;font-size:13px;white-space:nowrap}
.term-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.term-tools .btn{min-height:34px;padding:5px 16px}
/* S3 单根播放控件：倍速/暂停/跳过 */
.anim-speed{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--grey);white-space:nowrap}
.anim-speed select{height:30px;padding:2px 6px;font-size:12.5px;color:var(--ink)}
.term-tools .btn-sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.term-body{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:10px;min-height:0}
.term-chart{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1);padding:6px 6px 2px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#kline{flex:1;min-height:0;width:100%}
.term-side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto}
.side-card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1);padding:8px 12px;margin:0}
.side-card h2{font-size:13px;font-weight:600;color:var(--lav-deep);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.side-card h2 .tip-trigger{width:20px;height:20px;margin-left:auto}
.game-actions{display:flex;gap:8px}
.game-actions .btn{flex:1;min-height:36px;padding:6px 10px}
#order-form{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#order-form label{display:flex;flex-direction:column;gap:3px;font-size:13px}
#order-form .wide{grid-column:1/-1}
#order-form input,#order-form select{height:34px;min-width:0;padding:4px 9px}
/* S2 决策快捷行：仓位百分比/填开盘价/观望，纯前端填单 */
.shortcut-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.shortcut-row .shortcut-label{font-size:12.5px;color:var(--ink);margin-right:2px}
.shortcut-row .btn{flex:1;min-width:62px;min-height:30px;padding:4px 6px;font-size:12.5px}
/* 禁用态视觉：游戏页只加载 lab-theme.css（无 style.css 的 button:disabled），
   不补则结算阶段「播放并结算/提交委托」disabled 仍实心紫色、看似可点。
   选择器特异性压过 .btn-primary:hover / .btn:active 的抬升与扫光。 */
.game-shell .btn:disabled,.game-shell .btn:disabled:hover,.game-shell .btn:disabled:active{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.game-shell .btn-primary:disabled:hover{background:var(--lav)}
.game-shell .btn-primary:disabled::after{display:none}
.game-shell .btn-ghost:disabled:hover{background:#fff;border-color:var(--line)}
#order-form input:disabled,#order-form select:disabled{opacity:.55;cursor:not-allowed}
#factor-dialog input:disabled{opacity:.5;cursor:not-allowed}
/* 回合卡固定高度：决策6行/结算7~8行/预热2行统一占位（最高8行≈200px），
   倍速连播 open↔closed 切换时右侧不再上下跳动；短内容顶对齐，底部留白属正常占位。 */
#round-info{margin-top:6px;min-height:200px}
#round-info .kv-grid{align-content:start}
#round-info .kv-grid span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#order-pending{font-size:13px;margin-top:6px;min-height:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#order-error{color:var(--up);font-size:13px;min-height:22px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.side-card .kv-grid{grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.kv-grid span:nth-child(odd){color:var(--grey)}
.kv-grid span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
#account{grid-template-columns:repeat(2,1fr);gap:5px}
#account .metric-card{padding:5px 8px}
#account .m-label{font-size:11.5px}
#account .m-value{font-size:16px;margin-top:0}
/* S1：收益率/最大回撤 正红负绿（红涨绿跌，--up 红 / --down 绿） */
#account .m-value.up{color:var(--up)}
#account .m-value.down{color:var(--down)}
.trades-wrap{max-height:136px;overflow-y:auto}
.trade-table{width:100%;font-size:12.5px;table-layout:fixed}
.trade-table th,.trade-table td{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade-table th{position:sticky;top:0;background:#fff;font-size:12px;padding:4px 6px;z-index:1}
.trade-table thead tr{border-bottom:1px solid var(--line)}
#factor-dialog{width:min(560px,94vw);max-height:80vh;padding:0;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);background:var(--panel);color:var(--ink)}
#factor-dialog::backdrop{background:rgba(36,31,46,.36)}
.fd-wrap{display:flex;flex-direction:column;max-height:80vh;padding:12px 14px;gap:8px}
.fd-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fd-head h2{font-size:15px;font-weight:600;color:var(--lav-deep);display:flex;align-items:center}
#factor-search{height:38px;width:100%}
#factor-groups{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.factor-group summary{cursor:pointer;padding:7px 2px;color:var(--lav-deep);font-weight:600;font-size:13.5px}
.factor-item{display:flex;gap:7px;align-items:center;padding:3px 0 3px 14px;font-size:13px;cursor:pointer}
.factor-item input{accent-color:var(--lav);flex:none}.factor-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-foot{display:flex;align-items:center;gap:10px}
#factor-status{flex:1;color:var(--lav-deep);font-size:13px;min-height:18px}
/* 终局总结弹窗（参考 QRE 个股回测页：揭示横幅 + 指标条 + 收益曲线 + 日K买卖点 + 磨损 + 明细） */
#summary-dialog{width:min(960px,96vw);max-height:90vh;padding:0;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);background:var(--panel);color:var(--ink)}
#summary-dialog::backdrop{background:rgba(36,31,46,.46)}
.sd-wrap{display:flex;flex-direction:column;max-height:90vh}
.sd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sd-head h2{font-size:16px;font-weight:700;color:var(--lav-deep);font-family:var(--serif)}
.sd-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.sd-block{margin:0}
.sd-block h3{font-size:13.5px;font-weight:600;color:var(--lav-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sd-block h3 .tip-trigger{width:20px;height:20px}
.sd-chart{width:100%;height:240px}
.sd-chart-k{height:320px}
.sd-range-note{font-size:12.5px;color:var(--lav-deep);margin-bottom:6px;font-variant-numeric:tabular-nums}
/* 终局揭示横幅：游戏中全程匿名，终局才揭示真实标的与时间区间（区别于 QRE 回测页的核心差异） */
.reveal-card{background:var(--lav-deep);color:#fff;border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-1)}
.reveal-eyebrow{font-size:12px;letter-spacing:.08em;color:#D8CFEA;margin-bottom:6px}
.reveal-name{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.2}
.reveal-code{font-size:13px;color:#D8CFEA;margin-top:2px;font-variant-numeric:tabular-nums}
.reveal-range{font-size:13.5px;margin-top:10px;color:#EFEAF7;font-variant-numeric:tabular-nums}
.reveal-pending{display:inline-flex;align-items:center;gap:8px}
.reveal-pending .tip-trigger{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.32)}
.reveal-note{font-size:12.5px;color:#D8CFEA;margin-top:6px}
#sd-metrics,#sd-wear{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
#sd-metrics .metric-card,#sd-wear .metric-card{padding:6px 9px}
#sd-metrics .m-value,#sd-wear .m-value{font-size:16px;margin-top:0}
#sd-metrics .m-label,#sd-wear .m-label{font-size:11.5px}
#summary-dialog .m-value.up{color:var(--up)}
#summary-dialog .m-value.down{color:var(--down)}
.sd-table-wrap{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.sd-table{font-size:12.5px;table-layout:auto}
.sd-table th,.sd-table td{padding:6px 10px;white-space:nowrap}
.sd-table th{position:sticky;top:0;background:var(--tint);font-size:12px;z-index:1}
.sd-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.sd-empty{padding:14px;color:var(--grey);font-size:13px;text-align:center}
.hidden{display:none!important}
@media(max-width:980px){.term-body{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:860px){
  #game-main{height:auto;min-height:0}
  body.playing{overflow-y:auto}
  .term-body{grid-template-columns:1fr}
  .term-chart{height:64dvh;min-height:400px}
  .term-side{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
}
@media(max-width:620px){
  .game-shell{padding:8px 10px 10px}
  #game-main{height:auto;gap:8px}
  .term-side{grid-template-columns:1fr}
  .term-chart{height:62dvh;min-height:360px}
  .term-bar{flex-wrap:wrap;gap:6px 10px;padding:6px 10px}
  .side-card .kv-grid{font-size:12.5px}
  #factor-dialog{width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  .fd-wrap{max-height:100dvh;height:100dvh}
  #summary-dialog{width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  .sd-wrap{max-height:100dvh;height:100dvh}
  .reveal-name{font-size:22px}
  .sd-chart{height:200px}.sd-chart-k{height:260px}
}
</style>
</head>
<body>
<div class="wrap game-shell">
  <div class="card" id="game-start">
    <div class="start-options">
      <label>对局时长<select id="opt-bars"><option value="250">1 年（250 回合）</option><option value="750">3 年（750 回合）</option><option value="1250" selected>5 年（1250 回合）</option></select></label>
      <label>初始资金<select id="opt-cash"><option value="100000">10 万</option><option value="500000">50 万</option><option value="1000000" selected>100 万</option><option value="5000000">500 万</option></select></label>
    </div>
    <button class="btn btn-primary" id="btn-new">开始随机一局</button>
    <button type="button" class="tip-trigger" data-tip="随机匿名股票与历史窗口。每个回合先决策，再收束一根 K 线；真实限价成交、T+1 与交易费用。" aria-label="游戏规则">?</button>
    <span id="start-status" role="status"></span>
  </div>
  <div id="game-main" class="hidden">
    <div class="term-bar">
      <div class="term-id"><span id="stock-title">B</span></div>
      <div id="phase" role="status"></div>
      <div class="spacer"></div>
      <div id="finish-note" class="hidden"></div>
      <div class="term-tools">
        <label class="anim-speed">倍速<select id="anim-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
        <button class="btn btn-ghost btn-sm" id="btn-autoplay" type="button" aria-pressed="false">▶ 连播</button>
        <button type="button" class="tip-trigger" data-tip="连播：自动逐日推进（每天仍正常结算）。有待成交委托、发生成交或终局时自动暂停；倍速决定节奏。" aria-label="连播规则">?</button>
        <button class="btn btn-ghost btn-sm" id="btn-anim-pause" type="button" disabled>暂停</button>
        <button class="btn btn-ghost btn-sm" id="btn-anim-skip" type="button" disabled>跳过</button>
        <button class="btn btn-ghost" id="btn-factors" type="button">指标</button>
        <button type="button" class="tip-trigger" data-tip="均线与布林带叠加在主图，MACD 等指标进入下方副图。持仓时主图常驻琥珀色成本价线；决策时另显委托区间、次日开盘与委托价。拖动下方滑块缩放，双击返回默认视口。" aria-label="图表规则">?</button>
        <button class="btn btn-primary hidden" id="btn-summary" type="button">对局总结</button>
      </div>
    </div>
    <div class="term-body game-layout">
      <section class="term-chart">
        <div id="kline"></div>
      </section>
      <aside class="term-side game-side">
        <section class="side-card">
          <h2>回合</h2>
          <div class="game-actions">
            <button class="btn btn-ghost" id="btn-advance">进入下一回合</button>
            <button class="btn btn-primary" id="btn-settle">播放并结算</button>
          </div>
          <div id="autoplay-status" role="status"></div>
          <div id="round-info"></div>
        </section>
        <section class="side-card">
          <h2>委托 <button type="button" class="tip-trigger" data-tip="仅决策阶段可委托或撤单。价格在前收 ±10% 内，触及委托价成交；未触及不成交。买入后 T+1 可卖。" aria-label="交易规则">?</button></h2>
          <form id="order-form">
            <label>方向<select id="order-side"><option value="buy">买入</option><option value="sell">卖出</option></select></label>
            <label>数量（股）<input id="order-quantity" type="number" step="100" min="100" value="100" required></label>
            <label class="wide">委托价<input id="order-price" type="number" step="0.01" min="0.01" required></label>
            <div class="wide shortcut-row">
              <span class="shortcut-label">仓位</span>
              <button class="btn btn-ghost" id="pos-25" type="button">25%</button>
              <button class="btn btn-ghost" id="pos-50" type="button">50%</button>
              <button class="btn btn-ghost" id="pos-100" type="button">100%</button>
              <button class="btn btn-ghost" id="btn-fill-open" type="button">填开盘价</button>
              <button class="btn btn-ghost" id="btn-wait" type="button">本回合观望</button>
            </div>
            <div class="game-actions wide">
              <button class="btn btn-primary" id="btn-order" type="submit">提交委托</button>
              <button class="btn btn-ghost" id="btn-cancel" type="button">撤销委托</button>
            </div>
          </form>
          <div id="order-pending"></div>
          <div id="order-error" role="alert"></div>
        </section>
        <section class="side-card">
          <h2>账户</h2>
          <div id="account" class="metric-strip"></div>
        </section>
        <section class="side-card">
          <h2>成交记录</h2>
          <div class="trades-wrap">
            <table class="tbl trade-table"><thead><tr><th>方向</th><th class="num">成交价</th><th class="num">数量</th><th class="num">费用</th></tr></thead><tbody id="trades"></tbody></table>
          </div>
        </section>
      </aside>
    </div>
  </div>
</div>
<dialog id="factor-dialog">
  <div class="fd-wrap">
    <div class="fd-head">
      <h2>技术因子 <button type="button" class="tip-trigger" data-tip="目录只含技术因子，勾选后懒加载。同名不同价格口径也可独立使用；均线叠加 K 线，MACD 等同副图。" aria-label="因子规则">?</button></h2>
      <button class="btn btn-ghost" id="fd-close" type="button">关闭</button>
    </div>
    <input id="factor-search" type="search" placeholder="搜索中文名、列名或 canonical" aria-label="搜索技术因子">
    <div id="factor-groups"></div>
    <div class="fd-foot"><div id="factor-status" role="status"></div></div>
  </div>
</dialog>
<dialog id="summary-dialog" aria-label="对局总结">
  <div class="sd-wrap">
    <div class="sd-head">
      <h2>对局总结</h2>
      <button class="btn btn-ghost" id="sd-close" type="button">关闭</button>
    </div>
    <div class="sd-scroll">
      <section class="sd-reveal" id="sd-reveal"></section>
      <section class="metric-strip" id="sd-metrics"></section>
      <section class="sd-block">
        <h3>收益曲线 <button type="button" class="tip-trigger" data-tip="策略净值＝逐日权益÷初始资金；买入持有＝期初开盘买入并持有到期末，即该股票在本区间的自然涨幅。两者同口径前复权，策略超出自然涨幅即为择时增益。" aria-label="收益曲线说明">?</button></h3>
        <div id="sd-range" class="sd-range-note"></div>
        <div id="sd-equity" class="sd-chart"></div>
      </section>
      <section class="sd-block">
        <h3>日K与买卖点 <button type="button" class="tip-trigger" data-tip="仅游戏窗口（不含预热）。红▲买入、绿▼卖出，按真实成交回合标注；下方为成交量。拖动缩放查看局部。" aria-label="买卖点说明">?</button></h3>
        <div id="sd-kline" class="sd-chart sd-chart-k"></div>
      </section>
      <section class="sd-block">
        <h3>交易磨损 <button type="button" class="tip-trigger" data-tip="佣金、印花税、过户费合计为总磨损；磨损率＝总磨损÷初始资金。净收益已扣除全部磨损。" aria-label="交易磨损说明">?</button></h3>
        <div id="sd-wear" class="metric-strip"></div>
      </section>
      <section class="sd-block">
        <h3>回合配对盈亏 <button type="button" class="tip-trigger" data-tip="按先进先出把买入与卖出配对成回合，净盈亏已分摊买卖费用；胜率与平均每笔净收益只统计已平仓回合。" aria-label="配对盈亏说明">?</button></h3>
        <div class="sd-table-wrap">
          <table class="tbl sd-table"><thead><tr><th>买入回合</th><th>卖出回合</th><th class="num">买入价</th><th class="num">卖出价</th><th class="num">数量</th><th class="num">净盈亏</th><th class="num">收益率</th></tr></thead><tbody id="sd-roundtrips"></tbody></table>
        </div>
      </section>
      <section class="sd-block">
        <h3>成交明细</h3>
        <div class="sd-table-wrap">
          <table class="tbl sd-table"><thead><tr><th>回合</th><th>日期</th><th>方向</th><th class="num">成交价</th><th class="num">数量</th><th class="num">费用</th></tr></thead><tbody id="sd-trades"></tbody></table>
        </div>
      </section>
    </div>
  </div>
</dialog>
<script src="/static/echarts.min.js"></script>
{# QRE-KLINE-PANE-OPTION（T1）：因子 pane → ECharts option 的共享出口，
   索引由 QREFactorLayout 内部生成，避免三处副本各写一份 2+i 而错位 #}
<script src="/static/factor-layout.js"></script>
<script src="/static/lab-ui.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const MACD = [
    'factors.stock_daily_momentum_close.macd_12_26_9',
    'factors.stock_daily_momentum_close.macds_12_26_9',
    'factors.stock_daily_momentum_close.macdh_12_26_9'
  ];
  let state = null, chart = null, catalog = new Map(), catalogGroups = [];

    $('factor-groups').innerHTML = catalogGroups.map((group, groupIndex) =>
      '<details class="factor-group"' + (groupIndex === 0 ? ' open' : '') + '><summary>' + esc(group.label) + '（' + group.factors.length + '）</summary>' +
      group.factors.map(f => '<label class="factor-item" data-search="' + esc((f.label + ' ' + f.column + ' ' + f.canonical).toLowerCase()) + '">' +
        '<input type="checkbox" data-canonical="' + esc(f.canonical) + '"><span title="' + esc(f.canonical) + '">' + esc(factorLabel(f)) + '</span></label>').join('') + '</details>'
    ).join('');
    syncFactorChecks();
  }
  function syncFactorChecks(){
    if (!state) return;
    const selected = new Set(state.selected || []);
    document.querySelectorAll('#factor-groups input[data-canonical]').forEach(input => { input.checked = selected.has(input.dataset.canonical); });
  }
  function filterFactors(){
    const query = $('factor-search').value.trim().toLowerCase();
    document.querySelectorAll('#factor-groups .factor-group').forEach((group, index) => {
      let visible = 0;
      group.querySelectorAll('.factor-item').forEach(item => {
        const hit = !query || (item.dataset.search || '').includes(query);
        item.classList.toggle('hidden', !hit);
        if (hit) visible += 1;
      });
      group.classList.toggle('hidden', visible === 0);
      group.open = query ? visible > 0 : index === 0;
    });
  }
  async function applyFactors(){
    const selected = Array.from(document.querySelectorAll('#factor-groups input[data-canonical]:checked')).map(input => input.dataset.canonical);
    $('factor-status').textContent = '正在加载所选因子…';
    try {
      await withBusy(async () => setState(await api(sessionUrl('/factors'), {method: 'POST', body: JSON.stringify({canonicals: selected})})));
      $('factor-status').textContent = '';
    } catch (error) { $('factor-status').textContent = error.message; syncFactorChecks(); }
  }
  function openFactors(){
    const dialog = $('factor-dialog');
    filterFactors();
    if (typeof dialog.showModal === 'function'){ if (!dialog.open) dialog.showModal(); }
    else { dialog.setAttribute('open', ''); }
  }
  function closeFactors(){
    const dialog = $('factor-dialog');
    if (typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }
  // ===== 终局总结（参考 QRE 个股回测页 lab_symbol.html；纯前端渲染 state.reveal，零后端架构改动）=====
  // 先进先出把成交配对成回合，净盈亏分摊买卖费用；胜率/平均净收益只统计已平仓回合。
  function roundTrips(marks){
    const lots = [], trips = [];
    for (const tr of marks){
      if (tr.side === 'buy'){
        lots.push({qty: tr.quantity, price: tr.price, fee: tr.cost / tr.quantity, t: tr.t});
      } else {
        let remain = tr.quantity;
        const sellFee = tr.cost / tr.quantity;
        let pnl = 0, matched = 0, buyCost = 0, entryT = null;
        while (remain > 0 && lots.length){
          const lot = lots[0];
          const take = Math.min(remain, lot.qty);
          pnl += (tr.price - lot.price) * take - (lot.fee + sellFee) * take;
          buyCost += lot.price * take; matched += take;
          if (entryT == null) entryT = lot.t;
          lot.qty -= take; remain -= take;
          if (lot.qty === 0) lots.shift();
        }
        if (matched > 0) trips.push({entryT, exitT: tr.t, qty: matched, buyPrice: buyCost / matched, sellPrice: tr.price, pnl, ret: buyCost ? pnl / buyCost : 0});
      }
    }
    return trips;
  }
  function gameRows(){ return (state.history || []).filter(r => r.t > state.warmup_bars && r.close != null); }
  function buyHoldReturn(){
    const rows = gameRows();
    if (!rows.length || !rows[0].open) return 0;
    return rows[rows.length - 1].close / rows[0].open - 1;
  }
  function metricMoneySigned(label, v){
    const n = Number(v), cls = n > 0 ? ' up' : n < 0 ? ' down' : '';
    return '<div class="metric-card"><div class="m-label">' + esc(label) + '</div><div class="m-value' + cls + '">' + esc((n > 0 ? '+' : '') + money(n)) + '</div></div>';
  }
  function summaryEquityOption(){
    const rv = state.reveal, base = state.initial_cash || 1;
    const strat = (rv.equity_curve || []).map(v => v / base);
    const rows = gameRows(), baseOpen = rows.length ? rows[0].open : null;
    const hold = [1];
    rows.forEach(r => hold.push(baseOpen ? r.close / baseOpen : 1));
    const n = Math.min(strat.length, hold.length);
    const x = []; for (let i = 0; i < n; i++) x.push(i === 0 ? '期初' : 'T' + i);
    return {
      animation: false,
      tooltip: {trigger: 'axis', formatter: ps => {
        const lines = [esc(ps[0].axisValueLabel || ps[0].name || '')];
        ps.forEach(p => lines.push((p.marker || '') + esc(p.seriesName) + ' ' + Number(p.value).toFixed(3)));
        return lines.join('<br/>');
      }},
      legend: {top: 0, textStyle: {fontSize: 11}},
      grid: {left: 48, right: 16, top: 30, bottom: 24},
      xAxis: {type: 'category', data: x, axisLabel: {fontSize: 10}, boundaryGap: false},
      yAxis: {type: 'value', scale: true, axisLabel: {fontSize: 10, formatter: v => Number(v).toFixed(2)}},
      series: [
        {name: '策略净值', type: 'line', data: strat.slice(0, n), showSymbol: false, lineStyle: {width: 1.8, color: '#6750A4'}, color: '#6750A4'},
        {name: '买入持有', type: 'line', data: hold.slice(0, n), showSymbol: false, lineStyle: {width: 1.4, type: 'dashed', color: '#9A93A6'}, color: '#9A93A6'}
      ]
    };
  }
  function summaryKlineOption(){
    const rv = state.reveal;
    const rows = (state.history || []).filter(r => r.t > state.warmup_bars && [r.open, r.close, r.low, r.high].every(v => v != null));
    const dates = rows.map((r, i) => 'T' + (i + 1));
    const candles = rows.map(r => ({value: [r.open, r.close, r.low, r.high],
      itemStyle: {color: r.close >= r.open ? '#C93A3A' : '#1E8E5A', color0: r.close >= r.open ? '#1E8E5A' : '#C93A3A',
        borderColor: r.close >= r.open ? '#C93A3A' : '#1E8E5A', borderColor0: r.close >= r.open ? '#1E8E5A' : '#C93A3A'}}));
    const volumes = rows.map(r => ({value: r.volume, itemStyle: {color: r.close >= r.open ? '#C93A3A' : '#1E8E5A'}}));
    const buys = [], sells = [];
    (rv.trade_marks || []).forEach(m => {
      const gi = m.t - state.warmup_bars - 1;
      if (gi < 0 || gi >= rows.length) return;
      const row = rows[gi];
      const point = {value: [gi, m.side === 'buy' ? row.low * 0.99 : row.high * 1.01], price: m.price, qty: m.quantity, date: m.date};
      (m.side === 'buy' ? buys : sells).push(point);
    });
    return {
      animation: false,
      tooltip: {trigger: 'axis', formatter: ps => {
        const lines = [esc(ps[0].axisValueLabel || ps[0].name || '')];
        ps.forEach(p => {
          if (p.seriesType === 'candlestick'){
            const v = (p.data && p.data.value) || p.value || [];
            lines.push('开 ' + price(v[0]) + ' 收 ' + price(v[1]) + ' 低 ' + price(v[2]) + ' 高 ' + price(v[3]));
          } else if (p.seriesName === '成交量'){
            lines.push((p.marker || '') + '成交量 ' + money(Array.isArray(p.value) ? p.value[1] : p.value));
          } else if (p.seriesName === '买入' || p.seriesName === '卖出'){
            const d = p.data || {};
            lines.push((p.marker || '') + p.seriesName + ' ' + d.qty + ' 股 @ ' + price(d.price) + (d.date ? '（' + d.date + '）' : ''));
          }
        });
        return lines.join('<br/>');
      }},
      legend: {top: 0, textStyle: {fontSize: 11}},
      grid: [{left: 48, right: 16, top: 30, height: '56%'}, {left: 48, right: 16, top: '74%', height: '16%'}],
      xAxis: [{type: 'category', data: dates, gridIndex: 0, axisLabel: {show: false}, axisTick: {show: false}},
        {type: 'category', data: dates, gridIndex: 1, axisLabel: {fontSize: 10}}],
      yAxis: [{type: 'value', gridIndex: 0, scale: true, splitNumber: 4, axisLabel: {fontSize: 10, formatter: v => Number(v).toFixed(2)}},
        {type: 'value', gridIndex: 1, scale: true, splitNumber: 2, axisLabel: {fontSize: 10}}],
      series: [
        {name: 'K线', type: 'candlestick', data: candles, xAxisIndex: 0, yAxisIndex: 0},
        {name: '买入', type: 'scatter', data: buys, xAxisIndex: 0, yAxisIndex: 0, symbol: 'triangle', symbolSize: 12, itemStyle: {color: '#C93A3A'}, z: 5},
        {name: '卖出', type: 'scatter', data: sells, xAxisIndex: 0, yAxisIndex: 0, symbol: 'triangle', symbolRotate: 180, symbolSize: 12, itemStyle: {color: '#1E8E5A'}, z: 5},
        {name: '成交量', type: 'bar', data: volumes, xAxisIndex: 1, yAxisIndex: 1, itemStyle: {color: '#B7A6E8'}}
      ],
      dataZoom: [{type: 'inside', xAxisIndex: [0, 1]}, {type: 'slider', xAxisIndex: [0, 1], bottom: 0, height: 14, showDetail: false}]
    };
  }
  function renderSummary(){
    const rv = state.reveal, a = state.account;
    // 区间自然收益数据：该股票在游戏区间的自然涨幅（期初开盘→期末收盘）及其价格 basis。
    const rows = gameRows();
    const baseOpen = rows.length ? rows[0].open : null;
    const endClose = rows.length ? rows[rows.length - 1].close : null;
    $('sd-range').innerHTML = (baseOpen != null && endClose != null)
      ? '区间自然涨幅 <b>' + esc(fmtPct(buyHoldReturn())) + '</b> · 期初开盘 ' + price(baseOpen) + ' → 期末收盘 ' + price(endClose) + ' · ' + rows.length + ' 个交易日'
      : '';
    // 揭示横幅（区别于 QRE 回测页的核心差异）：真实名称/代码 + 真实时间区间。
    // 名称缺失时占位并提示需 WSL 补充映射——不伪造真实证券名称。
    const nameHtml = rv.real_name
      ? '<div class="reveal-name">' + esc(rv.real_name) + '</div>'
      : '<div class="reveal-name reveal-pending">真实名称待揭示<button type="button" class="tip-trigger" data-tip="快照已脱敏（匿名代码＋日期偏移）。真实证券名称映射 identity.json 由 WSL 侧提供后即在终局揭示；当前不伪造名称。" aria-label="真实名称说明">?</button></div>';
    const codeHtml = rv.real_code ? '<div class="reveal-code">' + esc(rv.real_code) + '</div>' : '';
    const noteHtml = rv.real_name ? '' : '<div class="reveal-note">匿名代码 ' + esc(state.display_code) + ' · 真实名称待 WSL 补充映射</div>';
    $('sd-reveal').innerHTML = '<div class="reveal-card">' +
      '<div class="reveal-eyebrow">终局揭示 · 你交易的是</div>' + nameHtml + codeHtml +
      '<div class="reveal-range">' + esc(rv.start_date) + ' → ' + esc(rv.end_date) + ' · 选取 ' + rv.selected_bars + ' 回合 / 实际 ' + rv.played_bars + ' 回合</div>' +
      noteHtml + '</div>';
    const trips = roundTrips(rv.trade_marks || []);
    const wins = trips.filter(t => t.pnl > 0).length;
    const winRate = trips.length ? wins / trips.length : 0;
    const avgNet = trips.length ? trips.reduce((s, t) => s + t.pnl, 0) / trips.length : 0;
    $('sd-metrics').innerHTML =
      metric('最终权益', money(a.equity)) +
      metricSigned('区间收益率', state.return_pct) +
      metricSigned('区间自然涨幅', buyHoldReturn()) +
      metricSigned('最大回撤', -Math.abs(state.max_drawdown)) +
      metric('交易笔数', state.trades.length + ' 笔') +
      metric('胜率', trips.length ? (winRate * 100).toFixed(1) + '%' : '—') +
      metricMoneySigned('平均每笔净收益', avgNet);
    const cb = a.cost_breakdown || {};
    const wearRate = state.initial_cash ? (cb.total || 0) / state.initial_cash : 0;
    $('sd-wear').innerHTML =
      metric('佣金', money(cb.commission || 0)) +
      metric('印花税', money(cb.stamp_tax || 0)) +
      metric('过户费', money(cb.transfer_fee || 0)) +
      metric('总磨损', money(cb.total || 0)) +
      metric('磨损率', (wearRate * 100).toFixed(2) + '%') +
      metricMoneySigned('净收益额', a.equity - state.initial_cash);
    const gt = t => 'T' + (t - state.warmup_bars);  // 全局 turn → 游戏窗口回合（与总结 K 线横轴一致）
    $('sd-roundtrips').innerHTML = trips.length ? trips.map(t =>
      '<tr><td>' + gt(t.entryT) + '</td><td>' + gt(t.exitT) + '</td><td class="num">' + price(t.buyPrice) + '</td><td class="num">' + price(t.sellPrice) + '</td><td class="num">' + t.qty + '</td><td class="num ' + (t.pnl > 0 ? 'pos' : t.pnl < 0 ? 'neg' : 'flat') + '">' + money(t.pnl) + '</td><td class="num ' + (t.ret > 0 ? 'pos' : t.ret < 0 ? 'neg' : 'flat') + '">' + fmtPct(t.ret) + '</td></tr>'
    ).join('') : '<tr><td colspan="7" class="sd-empty">本局无已平仓回合</td></tr>';
    const marks = rv.trade_marks || [];
    $('sd-trades').innerHTML = marks.length ? marks.map(m =>
      '<tr><td>' + gt(m.t) + '</td><td>' + esc(m.date || '') + '</td><td class="' + (m.side === 'buy' ? 'pos' : 'neg') + '">' + (m.side === 'buy' ? '买入' : '卖出') + '</td><td class="num">' + price(m.price) + '</td><td class="num">' + m.quantity + '</td><td class="num">' + money(m.cost) + '</td></tr>'
    ).join('') : '<tr><td colspan="6" class="sd-empty">本局无成交</td></tr>';
    if (window.LabUI && LabUI.helpTips) LabUI.helpTips();
  }
  function openSummary(){
    if (!state || !state.finished || !state.reveal) return;
    renderSummary();
    const dialog = $('summary-dialog');
    if (typeof dialog.showModal === 'function'){ if (!dialog.open) dialog.showModal(); }
    else dialog.setAttribute('open', '');
    requestAnimationFrame(() => {
      if (!sdEquityChart) sdEquityChart = echarts.init($('sd-equity'));
      if (!sdKChart) sdKChart = echarts.init($('sd-kline'));
      sdEquityChart.setOption(summaryEquityOption()); sdEquityChart.resize();
      sdKChart.setOption(summaryKlineOption()); sdKChart.resize();
    });
  }
  function closeSummary(){
    const dialog = $('summary-dialog');
    if (typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }
  async function startGame(){
    clearTimeout(ff.timer); ff.active = false;
    $('start-status').textContent = '正在抽取随机股票与历史窗口…';
    $('btn-new').disabled = true;
    const body = {game_bars: Number($('opt-bars').value), initial_cash: Number($('opt-cash').value)};
    try { await withBusy(async () => setState(await api('/game/api/sessions', {method: 'POST', body: JSON.stringify(body)}))); }
    catch (error) { $('start-status').textContent = error.message; $('btn-new').disabled = false; }
  }
  async function advance(){
    cancelAnim();
    try { await withBusy(async () => setState(await api(sessionUrl('/advance'), {method: 'POST'}))); $('order-error').textContent = ''; }
    catch (error) { $('order-error').textContent = error.message; }
  }
  async function closeDay(){
    try {
      await withBusy(async () => setState(await api(sessionUrl('/close'), {method: 'POST'})));
      $('order-error').textContent = '';
      if (state.settlement && !ff.active) startBarAnimation(state.settlement);
    } catch (error) { $('order-error').textContent = error.message; }
  }
  // S2 决策快捷（纯前端填单，服务端校验仍为最终闸 22 号:97）。
  // 仓位按钮随方向切换：买按现金×pct/1.01/次日开盘取整百股（留 1% 费用余量），
  // 卖按可卖×pct 取整百股。
  function currentPositionQty(pct){
    const d = state.decision || {};
    if ($('order-side').value === 'buy'){
      const open = d.next_open;
      if (!open) return 0;
      return Math.floor(state.account.cash * pct / 1.01 / open / 100) * 100;
    }
    return Math.floor(state.account.sellable * pct / 100) * 100;
  }
  function applyPosition(pct){
    if (!state || state.phase !== 'open') return;
    const qty = currentPositionQty(pct);
    $('order-quantity').value = String(qty);
    $('order-error').textContent = qty < 100
      ? ($('order-side').value === 'buy' ? '可用资金不足一手（100 股）' : '可卖持仓不足一手（100 股）')
      : '';
  }
  function fillOpen(){
    if (!state || state.phase !== 'open') return;
    const open = (state.decision || {}).next_open;
    if (open != null) $('order-price').value = price(open);
  }
  async function waitRound(){
    if (!state || state.phase !== 'open') return;
    try {
      if (state.pending_order) await withBusy(async () => setState(await api(sessionUrl('/cancel'), {method: 'POST'})));
      $('order-pending').textContent = '本回合观望（不提交委托）';
      $('order-error').textContent = '';
    } catch (error) { $('order-error').textContent = error.message; }
  }
  async function restore(){
    let id = null;
    try { id = localStorage.getItem('qre_game_session'); } catch (_) {}
    if (!id) return;
    try { state = await api('/game/api/sessions/' + id); setState(state); }
    catch (_) { try { localStorage.removeItem('qre_game_session'); } catch (_) {} }
  }
  $('btn-new').addEventListener('click', startGame);
  $('btn-advance').addEventListener('click', advance);
  $('btn-settle').addEventListener('click', closeDay);
  $('btn-factors').addEventListener('click', openFactors);
  $('fd-close').addEventListener('click', closeFactors);
  $('btn-summary').addEventListener('click', openSummary);
  $('sd-close').addEventListener('click', closeSummary);
  $('btn-cancel').addEventListener('click', async () => {
    try { await withBusy(async () => setState(await api(sessionUrl('/cancel'), {method: 'POST'}))); }
    catch (error) { $('order-error').textContent = error.message; }
  });
  [['pos-25', 0.25], ['pos-50', 0.5], ['pos-100', 1]].forEach(([id, pct]) =>
    $(id).addEventListener('click', () => applyPosition(pct)));
  $('btn-fill-open').addEventListener('click', fillOpen);
  $('btn-wait').addEventListener('click', waitRound);
  $('btn-autoplay').addEventListener('click', toggleAutoplay);
  $('btn-anim-pause').addEventListener('click', togglePauseAnim);
  $('btn-anim-skip').addEventListener('click', finishAnim);
  $('anim-speed').addEventListener('change', () => {
    anim.speed = Number($('anim-speed').value) || 1;
    if (anim.active && !anim.paused) scheduleAnim();
    if (ff.active){ clearTimeout(ff.timer); ff.timer = setTimeout(autoplayStep, ffCadence()); }
  });
  $('order-form').addEventListener('submit', async event => {
    event.preventDefault();
    $('order-error').textContent = '';
    try {
      await withBusy(async () => setState(await api(sessionUrl('/orders'), {method: 'POST', body: JSON.stringify({
        side: $('order-side').value, price: Number($('order-price').value), quantity: Number($('order-quantity').value)
      })})));
    } catch (error) { $('order-error').textContent = error.message; }
  });
  $('factor-groups').addEventListener('change', event => { if (event.target.matches('input[data-canonical]')) applyFactors(); });
  $('factor-search').addEventListener('input', filterFactors);
  window.addEventListener('resize', () => {
    if (!state) return;
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (chart) renderChart();
      if ($('summary-dialog').open){ if (sdEquityChart) sdEquityChart.resize(); if (sdKChart) sdKChart.resize(); }
    });
  });
  if (window.LabUI && LabUI.helpTips) LabUI.helpTips();
  animDataset('idle'); renderAnimControls();
  $('kline').dataset.autoplay = 'off'; renderAutoplayControls();
  Promise.all([restore(), (async () => {
    try {
      const data = await api('/game/api/factors');
      catalogGroups = data.groups || [];
      catalogGroups.forEach(group => group.factors.forEach(f => catalog.set(f.canonical, f)));
      renderFactorGroups(); filterFactors(); if (state) renderChart();
    } catch (error) { $('factor-status').textContent = '因子目录加载失败：' + error.message; }
  })()]);
})();
</script>
