- id: ema_cross_with_column_typo
  description: "EMA5 上穿 EMA20 买入，下穿卖出"
  llm_output: |
    experiment:
      name: nl_ema_cross
      market_profile: ashare_daily_default
      frequency: daily
    data:
      market_fields: [open, high, low, close, pre_close, vol, amount]
      factor_fields:
        ema5: factors.stock_daily_overlap_close.ema5
        ema20: factors.stock_daily_overlap_close.ema20
    universe:
      exclude_st: true
      exclude_suspended: true
      exclude_risk_warning: true
      min_listing_days: 120
    signal:
      entry: (ema5 > ema20) and (ema5.shift(1) <= ema20.shift(1))
      exit: (ema5 < ema20) and (ema5.shift(1) >= ema20.shift(1))
    holding:
      max_holding_days: 0
    evaluation:
      forward_return_horizons: [1, 3, 5, 10, 20]
      quantiles: 5
  expect:
