    exit_has_shift: true
    factor_fields:
      ema5: factors.stock_daily_overlap_close.ema_5
      ema20: factors.stock_daily_overlap_close.ema_20
    corrections_from: ["ema5", "ema20"]

- id: breakout_20d_high
  description: "收盘价突破 20 日高点买入，跌破 20 日低点卖出"
  llm_output: |
    experiment:
      name: nl_breakout_20d
      market_profile: ashare_daily_default
      frequency: daily
    data:
      market_fields: [open, high, low, close, pre_close, vol, amount]
      factor_fields: {}
    universe:
      exclude_st: true
      exclude_suspended: true
      exclude_risk_warning: true
      min_listing_days: 120
    signal:
      entry: close > high.rolling(20).max().shift(1)
      exit: close < low.rolling(20).min().shift(1)
    holding:
      max_holding_days: 0
    evaluation:
      forward_return_horizons: [1, 3, 5, 10, 20]
      quantiles: 5
  expect:
    entry_has_shift: true
    exit_has_shift: true
    entry_contains: ["close > high.rolling(20).max().shift(1)"]
    exit_contains: ["close < low.rolling(20).min().shift(1)"]
    factor_fields: {}

- id: pullback_from_20d_high
  description: "价格自 20 日高点回调 8% 买入，回到 20 日高点卖出"
  llm_output: |
    experiment:
      name: nl_pullback_8pct
      market_profile: ashare_daily_default
      frequency: daily
    data:
      market_fields: [open, high, low, close, pre_close, vol, amount]
      factor_fields: {}
    universe:
      exclude_st: true
      exclude_suspended: true
      exclude_risk_warning: true
      min_listing_days: 120
    signal:
      entry: close <= high.rolling(20).max() * 0.92
      exit: close >= high.rolling(20).max()
    holding:
      max_holding_days: 0
    evaluation:
      forward_return_horizons: [1, 3, 5, 10, 20]
      quantiles: 5
  expect:
    entry_contains: ["close <= high.rolling(20).max() * 0.92"]
    exit_contains: ["close >= high.rolling(20).max()"]
    factor_fields: {}

- id: volume_expansion_entry
  description: "成交量放大到 5 日均量 1.5 倍以上，且收盘价大于 20 日均线时买入"
  llm_output: |
    experiment:
      name: nl_volume_expansion
      market_profile: ashare_daily_default
      frequency: daily
    data:
      market_fields: [open, high, low, close, pre_close, vol, amount]
      factor_fields:
        sma_20: factors.stock_daily_overlap_close.sma_20
    universe:
      exclude_st: true
      exclude_suspended: true
      exclude_risk_warning: true
      min_listing_days: 120
    signal:
      entry: (vol > vol.rolling(5).mean() * 1.5) and (close > sma_20)
    holding:
      max_holding_days: 0
    evaluation:
      forward_return_horizons: [1, 3, 5, 10, 20]
      quantiles: 5
  expect:
    entry_contains: ["vol > vol.rolling(5).mean() * 1.5", "close > sma_20"]
    factor_fields:
      sma_20: factors.stock_daily_overlap_close.sma_20
