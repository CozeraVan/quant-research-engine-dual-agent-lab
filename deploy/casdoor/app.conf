; Casdoor 本地/自建认证服务配置（36 号文档 §5 步骤 1）
; 本地开发用 SQLite；上线切 PostgreSQL（driverName=postgres, dataSourceName=host=... user=...）
appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = sqlite
dataSourceName = file:/data/casdoor.db?cache=shared&mode=rwc
dbName = casdoor
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
staticBaseUrl = ""
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "zh"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
initDataNewOnly = false
initDataFile = "./init_data.json"
; 仅本地/开发：内置管理员 admin 的初始密码；生产必须改为强密码并在首启后删除本行
initAdminPassword = "123"
frontendBaseDir = "../cc_0"