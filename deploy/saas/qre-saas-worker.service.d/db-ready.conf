# QRE worker 启动前置：等本地 PostgreSQL 真正可连接再启动。
#
# 故障来源（2026-11-07）：机器重启时本 unit 的 `After=postgresql.service` 只保证
# 「集群 start 命令返回」的顺序，不保证「crash recovery 结束、能接受连接」。
# 实测 worker 13:01:48 自启并立刻领到排队的 CF-063 job，而 PG 直到 13:05:15
# 才 accepting connections，任务一查库即
#   FATAL: the database system is starting up (SQLSTATE 57P03) → engine_error
# 结果：每次「机器重启 + 队列里有在飞任务」都会白丢一个任务。
#
# 修法：ExecStartPre 循环探测 pg_isready，最多等 600s（300 次 × 2s），
# 超时才让服务启动失败并由 Restart=always 重试，绝不带病连库。
#
# 安装：
#   sudo install -m 0644 deploy/saas/qre-saas-worker.service.d/db-ready.conf \
#     /etc/systemd/system/qre-saas-worker.service.d/db-ready.conf
#   sudo systemctl daemon-reload      # 不要 restart：会打断在飞任务
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 300 ]; do /usr/bin/pg_isready -h 127.0.0.1 -p 5432 -q && exit 0; i=$((i+1)); sleep 2; done; echo "postgres not ready after 600s" >&2; exit 1'
TimeoutStartSec=900