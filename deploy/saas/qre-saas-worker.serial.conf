# CF 全期全量串行队列：单槽可领任意任务，避免空闲轻槽预留挤占 heavy 准入。
# 安装：sudo install -m 0644 本文件 /etc/systemd/system/qre-saas-worker.service.d/serial.conf
# 然后：sudo systemctl daemon-reload && sudo systemctl restart qre-saas-worker
[Service]
# CLI 参数优先于 EnvironmentFile；仅设置 Environment 会被既有 env 文件覆盖。
ExecStart=
ExecStart=/home/van/quant-workspace/quant-research-engine-dual-agent-lab/.venv/bin/python -m quant_research_engine.worker --light-slots 0 --heavy-slots 1
