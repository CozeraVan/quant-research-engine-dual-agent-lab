# aguhuice.com 站点（落地页静态 + SaaS Web/API 反代）
# C1 反代 / C2 IP 限流（QRE-ECS-C2，2026-09-19）。
# certbot 管理的 ssl/redirect 行勿动。

# --- QRE-ECS-C2：限流区（本文件位于 http 上下文内被 include，可在此声明） ---
# 限流矩阵（每 IP）：
#   qre_write  写端点（POST /api/jobs、/api/saas/jobs、/api/saas/nl/compile） 10r/m burst 3
#              ——提交回测/NL 编译是最贵操作；仅写方法受限（GET 读不受影响，
#              通过 $qre_write_key 空键跳过：GET/HEAD 键为空 = 不限）
#   qre_read   其余 /api/（结果查询等）                                     60r/m burst 20
#   qre_auth   验证码/登录（/api/saas/auth/*）                               5r/m burst 2（防爆破）
#   qre_worker /api/worker/*                                               120r/m burst 30
#              ——单 worker 心跳+claim 频率低，宽松限流兜底，认证靠 X-Worker-Token
# 并发：limit_conn 每 IP 20。
limit_req_zone $binary_remote_addr zone=qre_read:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=qre_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=qre_worker:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=qre_conn:10m;
map $request_method $qre_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $qre_write_key zone=qre_write:10m rate=10r/m;
limit_req_status 429;
limit_conn_status 429;
# 限流命中由 nginx 默认记 error_log（含 zone 名，可 grep 区分）

server {
    server_name aguhuice.com www.aguhuice.com _;

    root /var/www/aguhuice;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 防爆破：验证码/登录（/saas/login 页面本身是静态加载，真正要打的是这两个 API）
    location ~ ^/api/saas/auth/(code|login)$ {
        limit_req zone=qre_auth burst=2 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # worker 通道（X-Worker-Token 认证 + 宽松限流兜底）
    location ~ ^/api/worker/ {
        limit_req zone=qre_worker burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    # 写端点（提交回测/NL 编译）：仅写方法受限（qre_write 键空=GET 跳过）
    location ~ ^/api/(jobs|saas/jobs|saas/nl/compile) {
        limit_req zone=qre_write burst=3 nodelay;
        limit_conn qre_conn 20;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    # QRE SaaS Web/API 反代（qre-saas.service，127.0.0.1:8090）
    location /api/ {
        limit_req zone=qre_read burst=20 nodelay;
        limit_conn qre_conn 20;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }
    location /saas/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:8090;
        expires 1h;
    }

    # 2026-09-20 用户拍板：不保留落地页，/ 直达测试页（新建回测，未登录可浏览）
    location = / {
        return 302 /saas/new;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（落地页单文件，HTML 不缓存，其余 1h）
    # QRE-ECS-C5：/static/ 前缀是 SaaS 应用资源（gunicorn 反代），必须优先于落地页扩展名规则
    location ~* ^/static/.*\.(css|js|svg|png|jpg|woff2?)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aguhuice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aguhuice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.aguhuice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aguhuice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aguhuice.com www.aguhuice.com _;
    return 404; # managed by Certbot




}
