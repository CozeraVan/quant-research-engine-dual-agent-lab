# aguhuice.com 落地页站点（QRE-ECS-LANDING）
# 80 端口静态页；HTTPS 待 DNS 指向后由 certbot 接管（见 05_PROGRESS 条目）。
server {
    listen 80;
    listen [::]:80;
    server_name aguhuice.com www.aguhuice.com _;

    root /var/www/aguhuice;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（落地页单文件，HTML 不缓存，其余 1h）
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
