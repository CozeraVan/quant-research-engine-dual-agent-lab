# aguhuice.com 落地页站点（QRE-ECS-LANDING）
# 80 端口静态页；HTTPS 待 DNS 指向后由 certbot 接管（见 05_PROGRESS 条目）。
server {
    server_name aguhuice.com www.aguhuice.com _;

    root /var/www/aguhuice;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # QRE SaaS Web/API 反代（qre-saas.service，127.0.0.1:8090）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }
    location /saas/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:8090;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（落地页单文件，HTML 不缓存，其余 1h）
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aguhuice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aguhuice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.aguhuice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aguhuice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aguhuice.com www.aguhuice.com _;
    return 404; # managed by Certbot




}