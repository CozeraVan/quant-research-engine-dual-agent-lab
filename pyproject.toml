[project]
name = "quant-research-engine"
version = "0.1.0"
description = "Reusable multi-market research and backtesting framework, first implemented for A-share daily factor research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "arch>=6.3.0",
  "flask>=3.0.0",
  "matplotlib>=3.7.0",
  "openpyxl>=3.1.0",
  "pandas>=2.3.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.0",
  "pytest>=8.0.0",
  "sqlalchemy>=2.0.0",
]

[project.scripts]
qre = "quant_research_engine.apps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
