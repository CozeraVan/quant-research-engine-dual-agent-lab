experiment:
  name: ema200_bollinger_reversal_mvp
  market_profile: ashare_daily_default
  frequency: daily
  objective: screen_then_validate

data:
  market_table: public.stock_daily
  factor_schema: factors
  market_fields:
    - open
    - high
    - low
    - close
    - pre_close
    - vol
    - amount
  factor_fields:
    ema200: factors.stock_daily_overlap_typical_price.ema_200
    bb_upper: factors.stock_daily_volatility_close.bbu_20_2_0_2_0
    bb_lower: factors.stock_daily_volatility_close.bbl_20_2_0_2_0

universe:
  market: ashare
  exclude_st: true
  exclude_suspended: true
  exclude_risk_warning: true
  min_listing_days: 120
  min_amount: null

signal:
  type: expression
  entry: close > ema200 and close <= bb_lower
  exit: close >= bb_upper

execution:
  signal_date: t
  entry_execution: t_plus_1_open
  exit_execution: t_plus_1_open

holding:
  max_holding_days: 9999
  direction: long_only

evaluation:
  forward_return_horizons: [1, 3, 5, 10, 20]
  quantiles: 5
  benchmarks:
    - full_a_equal_weight
    - csi_300
    - csi_500
    - csi_1000
